        function renderControlsMenu(){
            overlay.classList.remove('hidden');
            const ACTION_LABELS={
                up:'Move Up', down:'Move Down', left:'Move Left', right:'Move Right',
                shoot:'Shoot', charge:'Charge', boost:'Boost / Dash',
                bigshot:'Big Shot', freeze:'Freeze Time', evolve:'Evolve Form'
            };
            function fmtKey(k){
                if(!k)return'?';
                const m={'arrowup':'↑','arrowdown':'↓','arrowleft':'←','arrowright':'→',' ':'SPACE','enter':'ENTER','shift':'SHIFT','escape':'ESC','tab':'TAB','control':'CTRL','alt':'ALT'};
                return m[k.toLowerCase()]||(k.length===1?k.toUpperCase():k.toUpperCase());
            }
            let listening=null;
            function buildHTML(){
                return `
                    <div class="menu-bg-glow"></div>
                    <div style="position:relative;z-index:1;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:0;">
                        <div style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;color:var(--player);text-shadow:0 0 16px rgba(75,245,255,.4);letter-spacing:.08em;margin-bottom:6px;">⌨️ KEYBOARD CONTROLS</div>
                        <p class="subtitle" style="margin-bottom:14px;">Click any key slot then press a new key to rebind. Changes saved automatically.</p>
                        <div style="font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px;padding:4px 14px;background:rgba(255,225,75,0.06);border:1px solid rgba(255,225,75,0.15);border-radius:8px;">— Player 1 —</div>
                        <div class="keybind-grid">
                            ${Object.keys(ACTION_LABELS).map(action=>`
                            <div class="keybind-row${listening===action?' listening':''}" id="kr_${action}">
                                <span class="keybind-label">${ACTION_LABELS[action]}</span>
                                <button class="keybind-btn${listening===action?' active':''}" data-action="${action}">${fmtKey(keybinds.p1[action])}</button>
                            </div>`).join('')}
                        </div>
                        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center;">
                            <button class="secondary" id="resetKeysBtn" style="padding:9px 18px;">↩ Reset Defaults</button>
                            <button class="play" id="backBtn" style="padding:11px 24px;">✓ Done</button>
                        </div>
                        ${listening?`<div style="margin-top:12px;font-size:11px;color:var(--player);letter-spacing:.08em;animation:fadeIn .3s ease;">Press any key to bind <b>${ACTION_LABELS[listening]}</b> — or <b>ESC</b> to cancel</div>`:''}
                    </div>
                `;
            }
            function render(){overlay.innerHTML=buildHTML();bindEvents();}
            function bindEvents(){
                document.querySelectorAll('.keybind-btn').forEach(btn=>{
                    btn.addEventListener('click',()=>{
                        listening=btn.dataset.action;
                        render();
                    });
                });
                document.getElementById('backBtn').addEventListener('click',()=>{
                    try{localStorage.setItem('eb_keybinds',JSON.stringify(keybinds));}catch(e){}
                    SoundEngine.sfx('uiClick');
                    overlay.classList.add('hidden');
                    renderMainMenu();
                });
                document.getElementById('resetKeysBtn').addEventListener('click',()=>{
                    keybinds.p1={up:'w',down:'s',left:'a',right:'d',shoot:' ',charge:'enter',bigshot:'f',freeze:'q',evolve:'e',boost:'shift'};
                    listening=null;
                    try{localStorage.setItem('eb_keybinds',JSON.stringify(keybinds));}catch(e){}
                    SoundEngine.sfx('uiClick');
                    render();
                });
            }
            let _keyListener=null;
            function attachKeyListener(){
                if(_keyListener)document.removeEventListener('keydown',_keyListener);
                _keyListener=function(e){
                    if(!listening)return;
                    e.preventDefault();e.stopPropagation();
                    if(e.key==='Escape'){listening=null;render();return;}
                    const newKey=e.key.toLowerCase();
                    keybinds.p1[listening]=newKey;
                    listening=null;
                    try{localStorage.setItem('eb_keybinds',JSON.stringify(keybinds));}catch(e){}
                    render();
                };
                document.addEventListener('keydown',_keyListener);
            }
            // Override render to also attach key listener
            const origRender=render;
            render=function(){
                origRender();
                if(listening)attachKeyListener();
                else if(_keyListener){document.removeEventListener('keydown',_keyListener);_keyListener=null;}
            };
            render();
        }

        let previewReq=null;

        // ---- renderCustomizeMenu with PC skin layout fix ----
        function renderCustomizeMenu(){
            if(previewReq){cancelAnimationFrame(previewReq);previewReq=null;}

            // Build skin cards HTML
            function skinCardHTML(def){
                const owned=skinsUnlocked[def.id];
                const active=playerSkin===def.id;
                const canBuy=coinBank>=def.cost&&!owned;
                const rarColor=SKIN_RARITY_COLORS[def.rarity]||'#8b8ca3';
                return `<div class="skin-card${active?' active':''}" data-skin="${def.id}" style="--acc:${rarColor};${!owned&&def.cost>0?'opacity:.82;':''}">
                    <span class="skin-icon-chip">${def.icon}</span>
                    <div class="skin-body">
                        <div class="skin-toprow">
                            <div class="name">${def.name}</div>
                            <span class="rarity-badge" style="background:${rarColor}22;color:${rarColor};border:1px solid ${rarColor}44">${def.rarity}</span>
                        </div>
                        <div class="skin-desc">${def.desc}</div>
                        ${owned?`<div class="owned">${active?'✦ Active':'Owned'}</div>`:`<div class="price">🪙${def.cost}</div>`}
                        ${!owned&&def.cost>0?`<button class="unlock-btn" data-skin="${def.id}" ${!canBuy?'disabled':''}>
                            ${canBuy?`Unlock`:`🔒 Need ${def.cost-coinBank} more`}
                        </button>`:''}
                    </div>
                </div>`;
            }

            // Group cards under rarity headers (Free / Rare / Epic / Legendary) so the
            // list reads as tiers instead of one long unbroken stack.
            const RARITY_ORDER=['free','rare','epic','legendary'];
            const RARITY_LABELS={free:'Free',rare:'Rare',epic:'Epic',legendary:'Legendary'};
            function skinsGridHTML(){
                let h='';
                for(const rar of RARITY_ORDER){
                    const defs=SKIN_DEFS.filter(d=>d.rarity===rar);
                    if(!defs.length)continue;
                    const col=SKIN_RARITY_COLORS[rar]||'#8b8ca3';
                    h+=`<div class="rarity-section">
                        <div class="rarity-section-label" style="color:${col};"><span>${RARITY_LABELS[rar]}</span></div>
                        ${defs.map(d=>skinCardHTML(d)).join('')}
                    </div>`;
                }
                return h;
            }

            const isPC2=platform==='pc';
            overlay.innerHTML=`
                <div class="customize-wrap" style="position:relative;display:flex;flex-direction:${isPC2?'row':'column'};align-items:${isPC2?'flex-start':'center'};width:100%;height:100%;justify-content:center;gap:${isPC2?'28px':'0'};padding:${isPC2?'0 24px':'0'};box-sizing:border-box;">
                    <div class="customize-grid" style="max-height:${isPC2?'88vh':'none'};overflow-y:auto;-webkit-overflow-scrolling:touch;width:${isPC2?'600px':'80vw'};flex-shrink:0;padding-right:${isPC2?'8px':'0'};order:${isPC2?'2':'0'};">
                        ${skinsGridHTML()}
                    </div>
                    <div class="customize-left" style="display:flex;flex-direction:column;align-items:center;max-width:${isPC2?'420px':'80vw'};flex:1;min-width:0;order:${isPC2?'1':'0'};">
                        <div class="bignum-label" style="margin-bottom:6px;">🎨 Skins</div>
                        <div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;background:rgba(255,225,75,0.07);border:1px solid rgba(255,225,75,0.12);border-radius:16px;padding:4px 14px;width:fit-content;">
                            <span style="font-size:16px;filter:drop-shadow(0 0 4px rgba(255,225,75,0.4));">🪙</span>
                            <span style="font-weight:800;color:var(--gold);font-size:14px;text-shadow:0 0 8px rgba(255,225,75,0.3);">${coinBank}</span>
                        </div>
                        <div id="skinPreviewWrap" style="position:relative;margin:0 auto 6px;width:min(80vw,300px);height:min(57.2vw,195px);">
                            <canvas id="previewCanvas" style="display:block;margin:0 auto;width:100%;height:100%;${isPC2?'border-radius:16px;border:1.5px solid rgba(75,245,255,0.25);box-shadow:0 8px 32px rgba(0,0,0,0.9),0 0 24px rgba(75,245,255,0.06);':'border-radius:12px;border:1.5px solid rgba(75,245,255,0.25);box-shadow:0 4px 20px rgba(0,0,0,0.8);'}" ></canvas>
                        </div>
                        <div style="font-size:8px;color:var(--ink-dim);margin:4px 0 6px;letter-spacing:.06em;text-align:center;text-transform:uppercase;">Tap to select • Tap active for details</div>
                        <button class="play" id="backBtn" style="margin-top:8px;padding:10px 28px;">← Done</button>
                    </div>
                </div>
            `;

            overlay.querySelectorAll('.skin-card').forEach(card=>{
                card.addEventListener('click',e=>{
                    if(e.target.classList.contains('unlock-btn'))return;
                    const skin=card.dataset.skin;
                    if(!skinsUnlocked[skin]||skin===playerSkin)return;
                    playerSkin=skin;refreshTierColors();saveSkinData();
                    // Lightweight update instead of a full renderCustomizeMenu() rebuild:
                    // rebuilding every card + recreating the canvas + restarting the
                    // rAF loop on every tap was what caused the visible flash/lag where
                    // the preview briefly still showed the previous skin. The preview
                    // loop already re-reads `playerSkin` live each frame, so all we need
                    // to do here is move the "active" styling.
                    overlay.querySelectorAll('.skin-card').forEach(c=>{
                        const isActive=c.dataset.skin===skin;
                        c.classList.toggle('active',isActive);
                        const ownedEl=c.querySelector('.owned');
                        if(ownedEl)ownedEl.textContent=isActive?'✦ Active':'Owned';
                    });
                });
            });
            overlay.querySelectorAll('.unlock-btn').forEach(btn=>{
                btn.addEventListener('click',e=>{
                    e.stopPropagation();
                    const skin=btn.dataset.skin;
                    const def=SKIN_DEFS.find(d=>d.id===skin);
                    if(!def)return;
                    if(coinBank>=def.cost&&!skinsUnlocked[skin]){
                        coinBank-=def.cost;try{localStorage.setItem('eb_coinBank',String(coinBank));}catch(e2){}
                        skinsUnlocked[skin]=true;saveSkinData();playerSkin=skin;renderCustomizeMenu();
                    }
                });
            });

            // ── Animated preview canvas ──────────────────────────────────────
            const pCanvas=document.getElementById('previewCanvas');
            if(!pCanvas){return;}
            const pCtx=pCanvas.getContext('2d');
            const dpr=Math.min(window.devicePixelRatio||1,2);
            const isPC=document.body.classList.contains('pc-mode');
            // Phone: use 68vw capped at 220px; PC: use 45vw capped at 360px
            const Wp=isPC?Math.min(window.innerWidth*0.45,360):Math.min(window.innerWidth*0.8,260);
            const Hp=Math.round(Wp*0.6);
            pCanvas.width=Math.round(Wp*dpr);pCanvas.height=Math.round(Hp*dpr);
            pCanvas.style.width=Wp+'px';pCanvas.style.height=Hp+'px';
            pCtx.setTransform(dpr,0,0,dpr,0,0);
            const cx=Wp/2,cy=Hp/2+2,r=Math.round(Wp*0.1);
            // Animated star field (pre-compute positions)
            const stars=Array.from({length:50},(_, i)=>({x:(i*53+7)%Wp,y:(i*79+11)%Hp,s:.25+((i*37)%10)*.1}));

            // Throttle preview to 30fps on phone to save GPU budget
            let _previewLastT=0;
            const _previewFpsLimit=isPC?0:(1000/30);
            function drawPreviewShip(ts){
                previewReq=requestAnimationFrame(drawPreviewShip);
                if(_previewFpsLimit&&ts-_previewLastT<_previewFpsLimit)return;
                _previewLastT=ts;
                pCtx.clearRect(0,0,Wp,Hp);
                // Background
                const bg=pCtx.createRadialGradient(cx,cy,0,cx,cy,Math.max(Wp,Hp)*.7);
                bg.addColorStop(0,'#0e1020');bg.addColorStop(1,'#050508');
                pCtx.fillStyle=bg;pCtx.fillRect(0,0,Wp,Hp);
                // Twinkling stars
                const t0=Date.now()*.0008;
                for(const st of stars){pCtx.globalAlpha=.15+.18*Math.sin(t0*2.1+st.x);pCtx.fillStyle='#fff';pCtx.beginPath();pCtx.arc(st.x,st.y,st.s,0,Math.PI*2);pCtx.fill();}
                pCtx.globalAlpha=1;
                // Skin aura ring under ship
                const def=SKIN_DEFS.find(d=>d.id===playerSkin)||SKIN_DEFS[0];
                const rarColor=SKIN_RARITY_COLORS[def.rarity]||'#4bf5ff';
                pCtx.save();pCtx.translate(cx,cy);
                pCtx.shadowColor=rarColor;pCtx.shadowBlur=24;
                pCtx.strokeStyle=rarColor+'55';pCtx.lineWidth=1.2;
                pCtx.beginPath();pCtx.arc(0,0,r*2.2+Math.sin(t0*3)*r*.1,0,Math.PI*2);pCtx.stroke();
                pCtx.shadowBlur=0;
                // Draw ship using the shared draw function
                pCtx.rotate(Math.sin(t0*.9)*.05);
                drawPlayerLight_Context(pCtx,0,0,r,0,playerSkin,0,false);
                pCtx.restore();
                // Skin name label
                pCtx.save();
                pCtx.font=`bold ${Math.round(r*.55)}px 'Orbitron',sans-serif`;
                pCtx.textAlign='center';pCtx.fillStyle=rarColor;
                pCtx.shadowColor=rarColor;pCtx.shadowBlur=8;
                pCtx.fillText(def.name.toUpperCase(),cx,Hp-7);
                pCtx.restore();
            }
            drawPreviewShip(0);
            document.getElementById('backBtn').addEventListener('click',()=>{if(previewReq){cancelAnimationFrame(previewReq);previewReq=null;}renderMainMenu();});
        }

        // ---- startGame with live tutorial hook ----
        function startGame(mode){
            // CRITICAL: kill the skin-preview rAF loop before starting gameplay.
            if(previewReq){cancelAnimationFrame(previewReq);previewReq=null;}
            refreshTierColors();

            if(onlineMode)destroyOnlineConnection();
            restoreFullActionButtons();
            AudioCore.beginOnGesture();
            const transition=document.getElementById('gameTransition');
            const transBar=document.getElementById('transitionBar');
            const transContent=document.getElementById('transitionContent');

            // Show transition overlay
            if(transition){
                transition.style.display='flex';
                transition.classList.add('active');
                if(transBar)transBar.style.width='30%';
            }

            // Phase 1: Show "INITIALIZING" with progress
            setTimeout(()=>{
                if(transBar)transBar.style.width='70%';
            },200);

            // Phase 2: Complete and start game
            setTimeout(()=>{
                if(transBar)transBar.style.width='100%';

                setTimeout(()=>{
                    // Start the actual game
                    overlay.classList.add('hidden');
                    applyAttributes();
                    resetGame(mode);
                    running=true;paused=false;pauseBtn.classList.add('show');updateBuffsHUD();updateLevelHUD();showPCHints();
                    MusicEngine.play('menu');

                    // Show live tutorial on first play (solo only)
                    if(gameMode===1 && !tutorialDone) showLiveTutorial();

                    // Exit transition
                    if(transition){
                        transition.classList.remove('active');
                        transition.classList.add('exit');
                        setTimeout(()=>{
                            transition.classList.remove('exit');
                            transition.style.display='none';
                            if(transBar)transBar.style.width='0%';
                        },600);
                    }


                },250);
            },500);
        }


        // PC: show keyboard hints briefly at game start
        let _pcHintShown=false;
        function showPCHints(){
            if(_pcHintShown||platform!=='pc')return;
            _pcHintShown=true;
            const hints=[
                {key:'WASD',label:'Move'},
                {key:'SPACE',label:'Shoot'},
                {key:'ENTER',label:'Charge'},
                {key:'SHIFT',label:'Boost'},
                {key:'E',label:'Evolve'},
                {key:'F',label:'Big Shot'},
                {key:'Q',label:'❄️ Freeze'},
            ];
            const el=document.createElement('div');
            el.id='pcStartHint';
            el.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:18;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none;animation:menuFadeUp .5s ease both;';
            el.innerHTML=hints.map(h=>`<div style="display:flex;align-items:center;gap:4px;background:rgba(13,14,26,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:4px 10px;backdrop-filter:blur(8px);">
                <span style="font-family:'Orbitron',sans-serif;font-size:9px;font-weight:800;color:var(--player);background:rgba(75,245,255,0.1);border:1px solid rgba(75,245,255,0.25);border-radius:4px;padding:1px 5px;">${h.key}</span>
                <span style="font-size:9px;color:var(--ink-dim);font-weight:600;">${h.label}</span>
            </div>`).join('');
            (document.getElementById('wrap')||document.body).appendChild(el);
            setTimeout(()=>{
                el.style.transition='opacity 1.2s ease';
                el.style.opacity='0';
                setTimeout(()=>el.remove(),1300);
            },4500);
        }

        function playIntroAnimation(){
            overlay.classList.add('hidden');
            const word='ECLIPSE';
            let letters='';
            for(let i=0;i<word.length;i++){letters+=`<span style="animation-delay:${.15+i*.06}s">${word[i]}</span>`;}
            introScreen.innerHTML=`
                <div class="intro-flare"></div>
                <div class="intro-ring"></div><div class="intro-ring"></div><div class="intro-ring"></div>
                <h1 class="intro-title">${letters}</h1>
            `;
            setTimeout(()=>{introScreen.classList.add('fadeOut');setTimeout(()=>{
                overlay.classList.add('hidden');
                if(platform==='phone'&&!tutorialDone){
                    showTutorial();
                }else{
                    showNameEntry();
                }
            },700);},2600);
        }

        // ================================================================
        // updateSharedWorld(dt)
        // THE SINGLE SOURCE OF TRUTH for all visual/cosmetic animation.
        // Called every frame by BOTH update() (solo/host) AND the client
        // path — guarantees byte-for-byte identical effects in every mode.
        // ================================================================
        function updateSharedWorld(dt){
            // ---- Timers & HUD ----
            timeVal.textContent=elapsed.toFixed(1);
            if(screenShake>0){screenShake*=.82;if(screenShake<.3)screenShake=0;}
            if(bossKillMessage.timer>0)bossKillMessage.timer-=dt;
            if(bigShotFlash.timer>0)bigShotFlash.timer-=dt;
            if(coinPopup){coinPopup.timer-=dt;coinPopup.y-=dt*16;if(coinPopup.timer<=0)coinPopup=null;}
            if(bossEntranceActive){bossEntranceTimer-=dt;if(bossEntranceTimer<=0)bossEntranceActive=false;}
            if(chapterState.active){chapterState.timer-=dt;if(chapterState.timer<=0){chapterState.active=false;cineTop.classList.remove('active');cineBot.classList.remove('active');chapterOverlay.classList.remove('active');}}
            if(timeFreezeTimer>0)timeFreezeTimer-=dt;

            // ---- Shooting stars ----
            for(const ss of shootingStars){
                ss.life+=dt;
                if(ss.life>ss.phase+0.8){ss.life=0;ss.phase=15+Math.random()*25;ss.x=Math.random()*WORLD_W;ss.y=Math.random()*WORLD_H*0.5;}
            }

            // ---- Particles: drift + age ----
            for(let i=particles.length-1;i>=0;i--){
                const p=particles[i];
                if(p.vx!==undefined){p.x+=p.vx*dt;p.vx*=0.90;}
                if(p.vy!==undefined){p.y+=p.vy*dt;p.vy*=0.90;}
                if(p.spin)p.rot=(p.rot||0)+p.spin*dt;
                p.life-=dt;
                if(p.life<=0){particles.splice(i,1);}
            }

            // ---- Ghost trails ----
            for(let i=ghostTrails.length-1;i>=0;i--){ghostTrails[i].life-=dt*2.8;if(ghostTrails[i].life<=0)ghostTrails.splice(i,1);}

            // ---- Shards ----
            updateShards(dt);

            // ---- Explosions (unified speed) ----
            for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.r+=dt*500;e.alpha-=dt*1.8;if(e.alpha<=0)explosions.splice(i,1);}

            // ---- Shockwaves (unified speed — non-hostile only here; hostile damage in update()) ----
            for(let i=shockwaves.length-1;i>=0;i--){const sw=shockwaves[i];sw.r+=dt*420;if(sw.r>=sw.maxR)shockwaves.splice(i,1);}

            // ---- Bullet movement + trail particles ----
            // On client we also advance bullet positions locally between host snapshots.
            // The host corrects positions via applyNetworkState; we only extrapolate visually.
            for(let i=bullets.length-1;i>=0;i--){
                const b=bullets[i];
                if(onlineMode==='client'){
                    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
                    if(b.life<=0||b.x<0||b.x>WORLD_W||b.y<0||b.y>WORLD_H){bullets.splice(i,1);continue;}
                }
                if(b.life<=0)continue;
                if(particles.length<MAX_PARTICLES*.7){
                    if(b.big&&b.trail){for(let k=0;k<2;k++)particles.push({x:b.x+(Math.random()-.5)*6,y:b.y+(Math.random()-.5)*6,life:.22,r:2.2,color:b.color,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20});}
                    if(Math.random()<.3)particles.push({x:b.x,y:b.y,life:.13,r:b.r*.5,color:b.color,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15});
                }
            }

            // ---- Boss bullets: move (client only — update() handles this on host/solo) ----
            if(onlineMode==='client'){
                for(let i=bossBullets.length-1;i>=0;i--){const bb=bossBullets[i];bb.x+=bb.vx*dt;bb.y+=bb.vy*dt;bb.life-=dt;if(bb.life<=0||bb.x<0||bb.x>WORLD_W||bb.y<0||bb.y>WORLD_H)bossBullets.splice(i,1);}
            }

            // ---- Enemy wobble + angle (client: enemies drift toward player2; host: toward player) ----
            const aimTarget=onlineMode==='client'?player2:player;
            for(const en of enemies){
                en.wob+=dt*1.8;
                // On client, smoothly rotate enemies toward our ship for visual accuracy
                if(onlineMode==='client'&&aimTarget){
                    const targetAngle=Math.atan2(aimTarget.y-en.y,aimTarget.x-en.x);
                    en.angle=angleLerp(en.angle,targetAngle,Math.min(1,dt*4));
                }else if(aimTarget){
                    en.angle=Math.atan2(aimTarget.y-en.y,aimTarget.x-en.x);
                }
                if(en.stalker&&en.stealthTimer!==undefined)en.stealthTimer=Math.max(0,en.stealthTimer-dt);
            }
            // On client: gently drift enemy positions toward their last known location
            if(onlineMode==='client'){
                for(const en of enemies){
                    if(aimTarget){
                        const spd=en.speed||90;
                        const ang=en.angle;
                        en.x+=Math.cos(ang)*spd*dt*0.7;
                        en.y+=Math.sin(ang)*spd*dt*0.7;
                        en.x=Math.max(en.size||16,Math.min(WORLD_W-(en.size||16),en.x));
                        en.y=Math.max(en.size||16,Math.min(WORLD_H-(en.size||16),en.y));
                    }
                }
            }

            // ---- Coin spin (solo only) ----
            if(gameMode!==2){for(const c of coinNodes)c.spin+=dt*2;}

            // ---- Powerup spin ----
            for(const p of powerups){p.spin+=dt*1.2;p.life-=dt;}

            // ---- closestDist: track nearest enemy to the active ship (used by vignette) ----
            if(onlineMode==='client'&&player2){
                closestDist=9999;
                for(const en of enemies){
                    const d=Math.hypot(player2.x-en.x,player2.y-en.y)-en.size*.6-(player2.r||11);
                    if(d<closestDist)closestDist=d;
                }
            }

            // ---- Remote host boost FX (client mode) ----
            if(onlineMode==='client'&&remotePlayerBoost.timer>0){
                remotePlayerBoost.timer-=dt;
                player._isP2=false;
                spawnShipFX(player,true,false,true,TIER_COLORS,transformTier);
            }

            // ---- Transform timer decay ----
            if(p2TransformTier>0&&p2TransformTimer>0){
                p2TransformTimer-=dt;
                if(p2TransformTimer<=0){p2TransformTier=Math.max(0,p2TransformTier-1);p2TransformTimer=p2TransformTier>0?TIER_DURATIONS[p2TransformTier]:0;}
            }

            // ---- Vignette danger (client updates closestDist above; host/solo: updated in update()) ----
            if(onlineMode==='client'){
                const danger=Math.max(0,Math.min(1,1-closestDist/180));
                vignette.style.background=`radial-gradient(ellipse at center,transparent 50%,rgba(255,40,70,${(danger*.2).toFixed(2)})100%)`;
            }

            updateFormBadge();
            updateChargeBarHUD();
            updateHP2PHUD();
            updateBuffsHUD();
            enforceArrayLimits();
        }

        // Client-only wrapper — keeps the loop() call site clean
        function updateClientCosmetics(dt){
            if(!player||!player2)return;
            // Advance elapsed locally so animations run at full frame-rate.
            // applyNetworkState() blends it toward the host value, preventing drift.
            elapsed += dt;
            updateSharedWorld(dt);
        }

        let lastT=0,frameDt=0.016;
        function loop(ts){
            if(!lastT)lastT=ts;
            const rawDt=(ts-lastT)/1000;
            // Cap dt to 33ms (30fps minimum) to prevent position teleports on lag spikes
            // Also clamp minimum to 1ms to prevent div-by-zero on very fast systems
            const dt=Math.min(Math.max(rawDt,0.001),0.016667);
            lastT=ts;
            frameDt=dt;
            try{
                if(running&&!paused){
                    if(onlineMode==='client'){
                        // NOTE: keyboardInput() is NOT called here for client —
                        // netInterpolateStep already handles client-side movement of player2.
                        // Calling it here would double-process movement and
                        // also incorrectly steer player (the host's ship).
                        clientNetworkTick(dt);
                        netInterpolateStep(dt);
                        // Still update cosmetic-only systems: particles, shards, shockwaves, explosions
                        updateClientCosmetics(dt);
                    }else{
                        update(dt);
                    }
                }
                render();
            }catch(err){
                // Never let a single bad frame permanently freeze the game - log it and
                // keep the animation loop alive so the player isn't stuck on a frozen screen.
                console.error('Frame error (recovered):',err);
            }
            requestAnimationFrame(loop);
        }

        playIntroAnimation();
        requestAnimationFrame(loop);
    })();
</script>
