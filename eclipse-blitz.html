        // ---- Public Quick Match (auto-matchmaking) ----
        let _quickMatchCancelled=false;
        const QM_POLL_INTERVAL_MS=2500;
        const QM_ROOM_PREFIX='eclipseblitz-qm-';
        const QM_SLOT_COUNT=12; // check up to 12 public slots

        function startQuickMatch(){
            _quickMatchCancelled=false;
            renderOnlineStatus('🔍 Searching for opponent…',null,false,true);
            // Try to join an existing public room first; if none found, create one
            tryJoinPublicRoom(0);
        }

        function tryJoinPublicRoom(slotIdx){
            if(_quickMatchCancelled)return;
            if(slotIdx>=QM_SLOT_COUNT){
                // No open room found — create our own starting from slot 0
                createPublicRoom(0);
                return;
            }
            const code='QM'+String(slotIdx).padStart(3,'0');
            let probeConn=null;
            // settled guards this whole probe attempt: PeerJS can fire BOTH the
            // connection-level 'error' and the peer-level 'error' for the same failed
            // attempt (or the timeout can race with either). Without this guard both
            // handlers would call tryJoinPublicRoom(slotIdx+1) independently, spinning
            // up two parallel search chains that fight over onlinePeer/onlineConn —
            // this was the main cause of the random-match instability.
            let settled=false;
            let myPeer=null;
            try{
                destroyOnlineConnection();
                myPeer=onlinePeer=new Peer(ONLINE_PEER_CONFIG);
            }catch(e){
                tryJoinPublicRoom(slotIdx+1);return;
            }
            const advance=(next)=>{
                if(settled)return;
                settled=true;
                clearTimeout(connectTimeout);
                try{if(probeConn)probeConn.close();}catch(_){}
                try{if(myPeer)myPeer.destroy();}catch(_){}
                if(onlinePeer===myPeer)onlinePeer=null;
                if(next!==null)tryJoinPublicRoom(next);
            };
            const connectTimeout=setTimeout(()=>advance(slotIdx+1),3500);
            myPeer.on('open',()=>{
                if(settled)return;
                probeConn=myPeer.connect(QM_ROOM_PREFIX+code,{reliable:true});
                probeConn.on('open',()=>{
                    if(settled)return;
                    settled=true;
                    clearTimeout(connectTimeout);
                    if(_quickMatchCancelled){try{probeConn.close();}catch(_){}try{myPeer.destroy();}catch(_){}return;}
                    onlineMode='client';
                    peerConnectionState='connected';
                    renderOnlineStatus('✅ Opponent found! Preparing match…',null,false,false);
                    // setupConnHandlers sets onlineConn and registers data/close handlers.
                    // beginOnlineMatchAsClient is triggered inside setupConnHandlers' open callback
                    // but won't fire again since conn is already open — call it explicitly here.
                    setupConnHandlers(probeConn);
                    monitorIceConnection(probeConn);
                    beginOnlineMatchAsClient();
                });
                probeConn.on('error',()=>advance(slotIdx+1));
            });
            myPeer.on('error',(err)=>{
                if(settled)return;
                if(err&&err.type==='peer-unavailable'){
                    // That slot is empty — try next slot
                    advance(slotIdx+1);
                }else{
                    settled=true;
                    clearTimeout(connectTimeout);
                    try{myPeer.destroy();}catch(_){}
                    if(onlinePeer===myPeer)onlinePeer=null;
                    renderOnlineStatus('<span style="color:#ff3b5c">⚠️ Network error</span><br><span style="font-size:11px;color:var(--ink-dim)">Check your connection and try again.</span>',null,true,true);
                }
            });
        }

        // createPublicRoom: try slots sequentially from slotIdx (not random),
        // so host and joiner are guaranteed to use the same slot numbering.
        function createPublicRoom(slotIdx){
            if(_quickMatchCancelled)return;
            if(slotIdx===undefined)slotIdx=0;
            if(slotIdx>=QM_SLOT_COUNT){
                // All slots busy — wait and retry from 0
                renderOnlineStatus('👀 All slots busy, retrying…<br><span style="font-size:10px;color:var(--ink-dim)">You\'ll be matched automatically</span>',null,false,true);
                setTimeout(()=>{if(!_quickMatchCancelled)startQuickMatch();},2000);
                return;
            }
            const code='QM'+String(slotIdx).padStart(3,'0');
            renderOnlineStatus('👀 Waiting for an opponent…<br><span style="font-size:10px;color:var(--ink-dim)">You\'ll be matched automatically</span>',null,false,true);
            destroyOnlineConnection();
            peerConnectionState='connecting';
            try{
                onlinePeer=new Peer(QM_ROOM_PREFIX+code,ONLINE_PEER_CONFIG);
            }catch(e){
                // Slot taken — try next
                setTimeout(()=>{if(!_quickMatchCancelled)createPublicRoom(slotIdx+1);},300);
                return;
            }
            const createTimeout=setTimeout(()=>{
                if(peerConnectionState==='connecting'&&!_quickMatchCancelled){
                    try{if(onlinePeer)onlinePeer.destroy();}catch(_){}
                    onlinePeer=null;
                    renderOnlineStatus('<span style="color:#ff3b5c">⚠️ Connection timed out</span>',null,true,true);
                }
            },PEER_CONNECT_TIMEOUT_MS+5000);
            onlinePeer.on('open',()=>{
                peerConnectionState='connected';
                onlineMode='host';
            });
            let _qmMatched=false;
            onlinePeer.on('connection',(conn)=>{
                // A public slot can occasionally receive a second stray connection
                // attempt (e.g. a joiner whose timeout raced the open event). Only
                // the first connection is accepted; anything after is rejected so it
                // can't desync the match that's already forming.
                if(_qmMatched){try{conn.close();}catch(_){}return;}
                _qmMatched=true;
                clearTimeout(createTimeout);
                peerConnectionState='connected';
                onlineMode='host';
                setupConnHandlers(conn);
                renderOnlineStatus('✅ Opponent found! Preparing match…',null,false,false);
            });
            onlinePeer.on('error',(err)=>{
                clearTimeout(createTimeout);
                if(err&&err.type==='unavailable-id'){
                    // Slot taken — try joining it first, then next slot
                    try{if(onlinePeer)onlinePeer.destroy();}catch(_){}
                    onlinePeer=null;
                    // Try to join this slot as a client before moving on
                    setTimeout(()=>{if(!_quickMatchCancelled)tryJoinPublicRoom(slotIdx);},200);
                }else{
                    renderOnlineStatus('<span style="color:#ff3b5c">⚠️ Network error</span><br><span style="font-size:11px;color:var(--ink-dim)">'+((err&&err.type)||'unknown')+'</span>',null,true,true);
                }
            });
        }

                            </div>

                        </div>
                        ${!_readyState.myReady?`<button class="btn-solo-run" id="readyBtn" style="width:100%;padding:14px;font-size:14px;"><span>✅ I'm Ready!</span></button>`:`<div style="font-size:11px;color:var(--gold);padding:8px;">Waiting for opponent…</div>`}
                        <button class="secondary" id="cancelReadyBtn" style="width:100%;">✗ Cancel</button>
                    </div>

                if(!_readyState.myReady){
                    document.getElementById('readyBtn').addEventListener('click',()=>{

                    destroyOnlineConnection();renderMainMenu();
                });
            }
            renderReady();
            // Store renderReady globally so network handler can call it when opponent readies
            _readyState._renderFn=renderReady;
            _readyState._onBothReady=onBothReady;
        }

        function checkBothReady(){
            if(_readyState.myReady&&_readyState.opponentReady){
                overlay.classList.add('hidden');
                if(_readyState._onBothReady)_readyState._onBothReady();
            }
        }

        function hostCreateRoom(){
            const code=genRoomCode();
            currentRoomCode=code;
            renderOnlineStatus('Setting up room…',null,false);
            destroyOnlineConnection();
            // destroyOnlineConnection() resets peerConnectionState to 'disconnected' —
            // set 'connecting' AFTER it, or the timeout below can never fire.
            peerConnectionState='connecting';

            // Set a timeout so users don't wait forever if PeerJS cloud is down
            peerConnectTimeout=setTimeout(()=>{
                if(peerConnectionState==='connecting'){
                    peerConnectionState='error';
                    try{if(onlinePeer)onlinePeer.destroy();}catch(e){}
                    onlinePeer=null;
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Connection timed out</span><br><span style="font-size:11px;color:var(--ink-dim)">PeerJS cloud service may be unavailable. Check your internet connection and try again.</span>',
                        null,
                        true
                    );
                }
            },PEER_CONNECT_TIMEOUT_MS);

            try{
                onlinePeer=new Peer(ONLINE_ROOM_PREFIX+code,ONLINE_PEER_CONFIG);
            }catch(e){
                clearTimeout(peerConnectTimeout);
                peerConnectionState='error';
                renderOnlineStatus(
                    '<span style="color:#ff3b5c">⚠️ Failed to create peer</span><br><span style="font-size:11px;color:var(--ink-dim)">'+e.message+'</span>',
                    null,

                );
                return;

            onlinePeer.on('open',()=>{

                onlineMode='host';
                SoundEngine.sfx('roomCreated');
                renderOnlineStatus('Waiting for opponent to join…',code,false);
            });

            onlinePeer.on('connection',(conn)=>{
                clearTimeout(peerConnectTimeout);
                peerConnectionState='connected';
                onlineMode='host';
                setupConnHandlers(conn);
                SoundEngine.sfx('playerJoined');
                renderOnlineStatus('Opponent found! Connecting…',code,false);
            });

            onlinePeer.on('error',(err)=>{
                clearTimeout(peerConnectTimeout);
                peerConnectionState='error';
                console.warn('peer error',err);
                if(err&&err.type==='unavailable-id'){
                    renderOnlineStatus('That code is taken, retrying…',null,true);
                    setTimeout(hostCreateRoom,400);

                else if(err&&err.type==='network'){
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Network error</span><br><span style="font-size:11px;color:var(--ink-dim)">Cannot reach PeerJS signaling server. This may be due to firewall restrictions or the service being down.</span>',
                        null,
                        true

                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Disconnected</span><br><span style="font-size:11px;color:var(--ink-dim)">Connection to signaling server was lost.</span>',

                        true

                        null,
                        true
                    );
                }
            });

            onlinePeer.on('disconnected',()=>{
                if(peerConnectionState==='connected'){
                    peerConnectionState='disconnected';
                    // Try to reconnect once
                    try{onlinePeer.reconnect();}catch(e){}
                }
            });

            onlinePeer.on('close',()=>{
                peerConnectionState='disconnected';

        function clientJoinRoom(code){
            renderOnlineStatus('Connecting to room '+code+'…',null,false);
            destroyOnlineConnection();
            // destroyOnlineConnection() resets peerConnectionState to 'disconnected' —
            // set 'connecting' AFTER it, or the timeout below can never fire.
            peerConnectionState='connecting';

            // Set timeout for client connection too
            peerConnectTimeout=setTimeout(()=>{
                if(peerConnectionState==='connecting'){
                    peerConnectionState='error';
                    try{if(onlinePeer)onlinePeer.destroy();}catch(e){}
                    onlinePeer=null;
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Connection timed out</span><br><span style="font-size:11px;color:var(--ink-dim)">Could not reach room '+code+'. The room may not exist or the PeerJS service may be unavailable.</span>',
                        null,
                        true
                    );
                }
            },PEER_CONNECT_TIMEOUT_MS);

            onlineMode='client';

            try{
                onlinePeer=new Peer(ONLINE_PEER_CONFIG);
            }catch(e){
                clearTimeout(peerConnectTimeout);
                peerConnectionState='error';
                renderOnlineStatus(
                    '<span style="color:#ff3b5c">⚠️ Failed to create peer</span><br><span style="font-size:11px;color:var(--ink-dim)">'+e.message+'</span>',
                    null,
                    true
                );
                return;
            }

            onlinePeer.on('open',()=>{
                // Only clear timeout if we successfully connect to the peer server
                // The actual connection to host happens via peer.connect()
                const conn=onlinePeer.connect(ONLINE_ROOM_PREFIX+code,{reliable:true});

                // Set a secondary timeout for the actual data connection to host
                const connTimeout=setTimeout(()=>{
                    if(peerConnectionState==='connecting'){
                        peerConnectionState='error';
                        try{if(conn)conn.close();}catch(e){}
                        renderOnlineStatus(
                            '<span style="color:#ff3b5c">⚠️ Room not responding</span><br><span style="font-size:11px;color:var(--ink-dim)">Could not connect to room '+code+'. The host may have left or the room code is incorrect.</span>',
                            null,
                            true
                        );
                    }
                },8000);

                setupConnHandlers(conn);

                conn.on('open',()=>{
                    clearTimeout(peerConnectTimeout);
                    clearTimeout(connTimeout);
                    peerConnectionState='connected';
                    renderOnlineStatus('Connected! Starting match…',null,false);
                    // beginOnlineMatchAsClient is called here explicitly since conn.on('open')
                    // inside setupConnHandlers already fired (conn was already open when registered)
                    beginOnlineMatchAsClient();
                });

                conn.on('error',(err)=>{
                    clearTimeout(connTimeout);
                    console.warn('client conn error',err);
                });
            });

            onlinePeer.on('error',(err)=>{
                clearTimeout(peerConnectTimeout);
                peerConnectionState='error';
                console.warn('peer error',err);
                if(err&&err.type==='peer-unavailable'){
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Room not found</span><br><span style="font-size:11px;color:var(--ink-dim)">Room '+code+' does not exist. Check the code and try again.</span>',
                        null,
                        true
                    );
                }
                else if(err&&err.type==='network'){
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Network error</span><br><span style="font-size:11px;color:var(--ink-dim)">Cannot reach PeerJS signaling server. Check your internet connection.</span>',
                        null,
                        true
                    );
                }
                else if(err&&err.type==='disconnected'){
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Disconnected</span><br><span style="font-size:11px;color:var(--ink-dim)">Connection to signaling server was lost.</span>',
                        null,
                        true
                    );
                }
                else{
                    renderOnlineStatus(
                        '<span style="color:#ff3b5c">⚠️ Connection error: '+(err&&err.type||'unknown')+'</span><br><span style="font-size:11px;color:var(--ink-dim)">Please check your connection and try again.</span>',
                        null,
                        true
                    );
                }
            });

            onlinePeer.on('disconnected',()=>{

        // Improved bindHold: tracks per-button touch IDs so multi-touch is reliable.
        // Each button only activates/deactivates for its own touch identifier,
        // preventing cross-contamination between joystick and action buttons.
        function bindHold(btn,onStart,onEnd){
            let activeTouchId=-1;
            btn.addEventListener('touchstart',e=>{
                e.preventDefault();
                e.stopPropagation();
                if(activeTouchId===-1){
                    activeTouchId=e.changedTouches[0].identifier;
                    btn.classList.add('pressed');
                    maybeShowFreezeHint();
                    onStart();
                }
            },{passive:false});
            const endTouch=(e)=>{
                e.preventDefault();
                e.stopPropagation();
                for(let i=0;i<e.changedTouches.length;i++){
                    if(e.changedTouches[i].identifier===activeTouchId){
                        activeTouchId=-1;
                        btn.classList.remove('pressed');
                        onEnd&&onEnd();
                        break;
                    }
                }
            };
            btn.addEventListener('touchend',endTouch,{passive:false});
            btn.addEventListener('touchcancel',endTouch,{passive:false});
            btn.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();btn.classList.add('pressed');onStart();});
            if(onEnd){
                btn.addEventListener('mouseup',e=>{e.preventDefault();e.stopPropagation();btn.classList.remove('pressed');onEnd();});
                btn.addEventListener('mouseleave',e=>{if(e.buttons!==0)return;btn.classList.remove('pressed');onEnd();});
            }
        }
        bindHold(chargeBtn,()=>{isMobileCharging=true;},()=>{isMobileCharging=false;});

        function update(dt){
            if(dying){updateShards(dt);deathTimer-=dt;if(deathTimer<=0)finishGameOver();return;}
            if(gameWon){updateShards(dt);bossKillMessage.timer-=dt;if(bossKillMessage.timer<=0)finishVictory();return;}

            if(bossEntranceActive){
                bossEntranceTimer-=dt;
                if(bossEntranceTimer<=0){
                    bossEntranceActive=false;
                }
            }

            if(chapterState.active){
                chapterState.timer-=dt;
                if(chapterState.timer<=0){
                    chapterState.active=false;
                    cineTop.classList.remove('active');cineBot.classList.remove('active');chapterOverlay.classList.remove('active');
                }
            }

            for(const ss of shootingStars){
                ss.life+=dt;
                if(ss.life>ss.phase+0.8){
                    ss.life=0;
                    ss.phase=15+Math.random()*25;
                    ss.x=Math.random()*WORLD_W;
                    ss.y=Math.random()*WORLD_H*0.5;
                }
            }

            elapsed+=dt;timeVal.textContent=elapsed.toFixed(1);keyboardInput();
            if(gameMode===1){
                pointsTimer+=dt;if(pointsTimer>=POINTS_INTERVAL){pointsTimer-=POINTS_INTERVAL;points+=POINTS_AWARD;updatePointsHUD();}
                if(bossWarningTimer>0)bossWarningTimer-=dt;
                // Boss spawn: prevent during live tutorial
                if(elapsed-lastBossSpawnTime>=30&&!gameWon&&bosses.length===0&&!liveTutorialActive){
                    spawnBoss();
                    lastBossSpawnTime=elapsed;
                    MusicEngine.play('boss');
                }
            }

            // Hostile shockwave damage check BEFORE updateSharedWorld removes them
            for(let i=shockwaves.length-1;i>=0;i--){
                const sw=shockwaves[i];
                if(sw.hostile&&Math.hypot(player.x-sw.x,player.y-sw.y)<sw.r){
                    if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}
                    else{triggerDeath();return;}
                }
            }

            // All visual cosmetics (particles, trails, explosions, bullets, etc.)
            updateSharedWorld(dt);

            for(const o of obstacles){
                if(o.hp<=0)continue;
                const cx=player.x,cy=player.y,r=player.r;
                const nx=Math.max(o.x,Math.min(o.x+o.w,cx));
                const ny=Math.max(o.y,Math.min(o.y+o.h,cy));
                const d=Math.hypot(cx-nx,cy-ny);
                if(d<r){const a=Math.atan2(cy-ny,cx-nx);const ov=r-d;player.x+=Math.cos(a)*ov;player.y+=Math.sin(a)*ov;player.vx=Math.cos(a)*35;player.vy=Math.sin(a)*35;}
                if(gameMode===2&&player2){
                    const cx2=player2.x,cy2=player2.y,r2=player2.r;
                    const nx2=Math.max(o.x,Math.min(o.x+o.w,cx2));
                    const ny2=Math.max(o.y,Math.min(o.y+o.h,cy2));
                    const d2=Math.hypot(cx2-nx2,cy2-ny2);
                    if(d2<r2){const a=Math.atan2(cy2-ny2,cx2-nx2);const ov=r2-d2;player2.x+=Math.cos(a)*ov;player2.y+=Math.sin(a)*ov;player2.vx=Math.cos(a)*35;player2.vy=Math.sin(a)*35;}
                }
            }



            if(transformTier>0&&transformTimer>0){
                transformTimer-=dt;
                if(transformTimer<=0){
                    if(transformTier===4){transformTier=3;transformTimer=TIER_DURATIONS[3];}
                    else if(transformTier===3){transformTier=2;transformTimer=TIER_DURATIONS[2];}
                    else if(transformTier===2){transformTier=1;transformTimer=TIER_DURATIONS[1];}
                    else {transformTier=0;transformTimer=0;}
                    maxCharge=100+transformTier*22+levelStats.maxChargeBonus;
                }
                updateFormBadge();
            }
            // p2TransformTier decay handled by updateSharedWorld — no duplicate needed here

            updateFriends(dt);
            if(buffs.speedT>0)buffs.speedT=Math.max(0,buffs.speedT-dt);
            if(buffs.slowT>0)buffs.slowT=Math.max(0,buffs.slowT-dt);
            if(buffs.shieldOn&&buffs.shieldT>0){buffs.shieldT-=dt;if(buffs.shieldT<=0)buffs.shieldOn=false;}
            updateBuffsHUD();

            // NOTE: on an online client, `player` represents the REMOTE (host's) ship.
            // Its position/effects are driven entirely by the network snapshots
            // (applyNetworkState / netInterpolateStep). Running the local simulation
            // below on the client too used to make the client's own key presses
            // (meant to steer player2, its own ship) also charge/boost/fire the
            // remote ship locally -> duplicate bullets, stray ghost trails, and
            // charge-halo flicker on the host's ship as seen by the joining player.
            // So this whole block is host / single-player / local-hotseat only.
            if(onlineMode!=='client'){
            const isCharging=keys[keybinds.p1.charge]||isMobileCharging;
            const isBoosting=(keys[keybinds.p1.boost]||isMobileBoosting)&&playerCharge>0;
            if(fireCooldown>0)fireCooldown-=dt;
            if(timeFreezeTimer>0)timeFreezeTimer-=dt;

            const tierB=(1+transformTier*.09)*(levelStats.chargeRateBonus);
            const chargeRate=50*tierB;
            if(isCharging){playerCharge=Math.min(maxCharge,playerCharge+chargeRate*dt);updateChargeBarHUD();}
            if(isBoosting){
                playerCharge=Math.max(0,playerCharge-14*dt);updateChargeBarHUD();
            }
            wasBoosting=isBoosting;

            const dmgB=levelStats.damageBonus;
            const fireCD=.1/tierB;
            if((keys[keybinds.p1.shoot]||isMobileShooting)&&!isMobileCharging&&!keys[keybinds.p1.charge]&&fireCooldown<=0&&(gameMode===2?playerCharge>=maxCharge*0.01:playerCharge>=1)){
                fireCooldown=fireCD;
                if(gameMode===1)playerCharge=Math.max(0,playerCharge-1);
                else playerCharge=Math.max(0,playerCharge-maxCharge*0.01);
                const sz=(3+transformTier*.8)*tierB;
                const baseDmg=Math.round((1+transformTier*.07)*dmgB);
                const p1Targets=gameMode===2?(player2?[player2]:[]):enemies.concat(bosses);
                // Phone aimbot: maxDist 480, coneRad 0.42 rad (~24°), strength 0.72
                const p1AimAngle=isPhone?applyAimAssist(player.x,player.y,player.angle,p1Targets,480,0.42,0.72):player.angle;
                bullets.push({x:player.x+Math.cos(p1AimAngle)*player.r,y:player.y+Math.sin(p1AimAngle)*player.r,vx:Math.cos(p1AimAngle)*760,vy:Math.sin(p1AimAngle)*760,r:sz,damage:Math.max(1,baseDmg),life:1.3,color:TIER_COLORS[transformTier],owner:'p1',_netNew:(gameMode===2),_id:++_bulletIdCounter});
                SoundEngine.sfx('collect');updateChargeBarHUD();
            }

            let spdMul=1;if(buffs.speedT>0)spdMul*=1.5;if(isBoosting)spdMul*=1.6;if(isCharging)spdMul*=.4;
            const statMul=(levelStats.speedBonus)*tierB;
            const speed=PLAYER_SPEED*spdMul*statMul;
            // Frame-rate independent movement with sub-stepping for smoothness
            const moveSteps=Math.max(1,Math.floor(dt/0.008));
            const stepDt=dt/moveSteps;
            for(let ms=0;ms<moveSteps;ms++){
                player.vx=input.x*speed;player.vy=input.y*speed;
                player.x+=player.vx*stepDt;player.y+=player.vy*stepDt;
            }
            player.x=Math.max(player.r,Math.min(WORLD_W-player.r,player.x));
            player.y=Math.max(player.r,Math.min(WORLD_H-player.r,player.y));
            updateCamera();

            if(input.x||input.y){
                // Only update angle from movement if not using mouse aim on PC
                if(platform!=='pc'||!settings.mouseControl||!mouseInCanvas)player.angle=Math.atan2(input.y,input.x);
            }
            // ---- Unified ship FX (boost / charge / movement trail) ----
            player._isP2=false;
            spawnShipFX(player,isBoosting,isCharging,!!(input.x||input.y),TIER_COLORS,transformTier);
            } // end onlineMode!=='client' guard

            // Player2 physics/shooting block — ONLY runs on the host (and local 2P hotseat).
            // On an online client, player2 is moved inside netInterpolateStep (client-side prediction)
            // and charged/shot via the network tick. Running it here too would double everything.
            if(gameMode===2&&player2&&onlineMode!=='client'){
                if(player2.fireCooldown>0)player2.fireCooldown-=dt;
                const p2Charging=onlineMode==='host'?keys[keybinds.p2.charge]||(netP2Input&&netP2Input.charge):keys[keybinds.p2.charge];
                const p2Boost=((onlineMode==='host'?(keys[keybinds.p2.boost]||(netP2Input&&netP2Input.boost)):keys[keybinds.p2.boost]))&&p2Charge>0;
                const p2TierB=(1+p2TransformTier*.09);
                if(p2Charging)p2Charge=Math.min(p2MaxCharge,p2Charge+50*p2TierB*dt);
                if(p2Boost)p2Charge=Math.max(0,p2Charge-14*dt);
                updateChargeBarHUD();
                const p2ShootKey=keys[keybinds.p2.shoot]||(onlineMode==='host'&&netP2Input&&netP2Input.shoot);
                const p2ChargeKey=keys[keybinds.p2.charge]||(onlineMode==='host'&&netP2Input&&netP2Input.charge);
                if(p2ShootKey&&!p2ChargeKey&&player2.fireCooldown<=0&&p2Charge>=p2MaxCharge*0.01){
                    player2.fireCooldown=0.1/p2TierB;
                    p2Charge=Math.max(0,p2Charge-p2MaxCharge*0.01);
                    const p2sz=(3+p2TransformTier*.8)*p2TierB;
                    const p2dmg=Math.round((1+p2TransformTier*.07));
                    const p2AimAngle=isPhone?applyAimAssist(player2.x,player2.y,player2.angle,[player],480,0.42,0.72):player2.angle;
                    bullets.push({x:player2.x+Math.cos(p2AimAngle)*player2.r,y:player2.y+Math.sin(p2AimAngle)*player2.r,vx:Math.cos(p2AimAngle)*760,vy:Math.sin(p2AimAngle)*760,r:p2sz,damage:Math.max(1,p2dmg),life:1.3,color:P2_TIER_COLORS[p2TransformTier],owner:'p2',_netNew:(gameMode===2),_id:++_bulletIdCounter});
                    SoundEngine.sfx('collect');
                }
                updateHP2PHUD();
                // ---- p2 movement: identical quality to player1 ----
                // Apply speed buffs (speedT) + tier bonus — was missing before
                let p2spdMul=1;
                if(buffs.speedT>0)p2spdMul*=1.5;  // speed buff applies to both
                if(p2Boost)p2spdMul*=1.6;
                if(p2Charging)p2spdMul*=0.4;
                const p2speed=PLAYER_SPEED*p2spdMul*p2TierB;
                const p2ix=onlineMode==='host'?(netP2Input.x||0):(player2.input?player2.input.x:0);
                const p2iy=onlineMode==='host'?(netP2Input.y||0):(player2.input?player2.input.y:0);
                // Sub-stepping for same smoothness as player1
                const p2Steps=Math.max(1,Math.floor(dt/0.008));
                const p2StepDt=dt/p2Steps;
                for(let ms=0;ms<p2Steps;ms++){
                    player2.vx=p2ix*p2speed;player2.vy=p2iy*p2speed;
                    player2.x+=player2.vx*p2StepDt;player2.y+=player2.vy*p2StepDt;
                }
                player2.x=Math.max(player2.r,Math.min(WORLD_W-player2.r,player2.x));
                player2.y=Math.max(player2.r,Math.min(WORLD_H-player2.r,player2.y));
                if(p2ix||p2iy)player2.angle=Math.atan2(p2iy,p2ix);
                // ---- Unified ship FX for player2 on host ----
                player2._isP2=true;
                spawnShipFX(player2,p2Boost,p2Charging,!!(p2ix||p2iy),P2_TIER_COLORS,p2TransformTier);
            }
            if(gameMode===2&&onlineMode==='host'){
                hostBroadcastTimer-=dt;
                // 60 Hz broadcast (was 30) — halves perceived lag on the joining client
                if(hostBroadcastTimer<=0){hostBroadcastTimer=1/60;hostBroadcastState();}
            }

            if(gameMode===1){
                lastSpawn+=dt;
                // Normal enemy spawn: prevent during live tutorial
                if(lastSpawn>DIFFICULTIES[settings.difficulty].spawnInterval*1.2&&enemies.length<MAX_ENEMIES&&!bosses.length&&!liveTutorialActive){lastSpawn=0;spawnEnemy();}
                powerupTimer-=dt;if(powerupTimer<=0&&powerups.length<1){spawnPowerup();powerupTimer=POWERUP_INTERVAL;}
            }

            for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.life-=dt;p.spin+=dt*1.2;if(p.life<=0){powerups.splice(i,1);continue;}if(Math.hypot(player.x-p.x,player.y-p.y)<p.r+player.r+2){collectPowerup(p.type);powerups.splice(i,1);}}

            for(const bp of boostPads){
                if(bp.cooldown>0){bp.cooldown-=dt;continue;}
                if(Math.hypot(player.x-bp.x,player.y-bp.y)<bp.r+player.r){
                    buffs.speedT=Math.max(buffs.speedT,2.8);updateBuffsHUD();bp.cooldown=4.5;SoundEngine.sfx('collect');
                    // Rich boostpad pickup burst — applies in all modes
                    for(let i=0;i<10;i++){const ba=Math.random()*Math.PI*2,bs=60+Math.random()*100;
                        particles.push({x:bp.x,y:bp.y,life:.5,r:2+Math.random()*2,color:'#5cff7e',vx:Math.cos(ba)*bs,vy:Math.sin(ba)*bs});}
                    shockwaves.push({x:bp.x,y:bp.y,r:0,maxR:40,color:'rgba(92,255,126,.4)',hostile:false});
                }
            }
            // Coins are solo-mode only — hidden in 2P / online modes
            if(gameMode!==2){
                for(let i=coinNodes.length-1;i>=0;i--){
                    const c=coinNodes[i];c.spin+=dt*2;
                    if(Math.hypot(player.x-c.x,player.y-c.y)<c.r+player.r){
                        addCoins(2+Math.floor(Math.random()*3));
                        for(let k=0;k<7;k++){const ca=Math.random()*Math.PI*2,cs=40+Math.random()*60;
                            particles.push({x:c.x,y:c.y,life:.4,r:1.5+Math.random()*2,color:'#ffe14b',vx:Math.cos(ca)*cs,vy:Math.sin(ca)*cs});}
                        coinNodes.splice(i,1);
                    }
                }
            }

            let slowMult=buffs.slowT>0?.4:1;if(timeFreezeTimer>0)slowMult*=.1;
            closestDist=9999;let shieldUsed=false;

            // ---- Enemy movement with live tutorial slowdown ----
            const tutSlow = liveTutorialActive ? liveTutorialEnemySpeedMult : 1;

            for(let idx=enemies.length-1;idx>=0;idx--){
                const en=enemies[idx];
                const dx=player.x-en.x,dy=player.y-en.y,dist=Math.hypot(dx,dy);
                closestDist=Math.min(closestDist,dist-en.size*.6-player.r);
                // ---- Enemy "intelligence": lead the player's predicted position ----
                // instead of just chasing where the player currently is, enemies
                // anticipate where the player is heading based on their velocity.
                // The lead amount is capped and scales down at close range so it
                // doesn't feel unfair right on top of the player.
                const leadT=Math.min(0.5,dist/650);
                const predX=player.x+(player.vx||0)*leadT;
                const predY=player.y+(player.vy||0)*leadT;
                const tdx=predX-en.x,tdy=predY-en.y;
                en.wob+=dt*1.8;const wobA=Math.sin(en.wob)*.25;const ang=Math.atan2(tdy,tdx)+wobA*.3;en.angle=Math.atan2(tdy,tdx);
                if(en.zigzag)en.angle+=Math.sin(elapsed*2.5+en.wob)*.6*dt;
                
                if(en.stalker){
                    en.stealthTimer-=dt;
                    if(en.stealthTimer<=0){
                        en.stealthTimer=2.0+Math.random()*1.5;
                        for(let k=0;k<5;k++)particles.push({x:en.x+(Math.random()-.5)*10,y:en.y+(Math.random()-.5)*10,life:.4,r:2,color:'#00ffaa'});
                    }
                    const stealthPhase=en.stealthTimer>1.2?1:en.stealthTimer>0.4?0.3:0.08;
                    const t=Math.min(elapsed/45,1);
                    en.speed=(90+t*45)*DIFFICULTIES[settings.difficulty].speedMult*1.3*(stealthPhase<0.5?2.2:1);
                }
                
                let juggernautMoved=false;
                if(en.juggernaut){
                    en.chargeTimer+=dt;
                    if(Math.random()<0.3)particles.push({x:en.x+(Math.random()-.5)*6,y:en.y+(Math.random()-.5)*6,life:.35,r:2,color:'#ff0044'});
                    if((dist<200&&en.chargeTimer>2.5)||(en.hp<en.maxHp*.5&&en.chargeTimer>1.5)){
                        en.chargeTimer=0;
                        const chargeA=Math.atan2(player.y-en.y,player.x-en.x);
                        en.vx=Math.cos(chargeA)*350;en.vy=Math.sin(chargeA)*350;
                        screenShake=6;
                        for(let k=0;k<8;k++){const a=Math.random()*Math.PI*2,s=40+Math.random()*80;shards.push({x:en.x,y:en.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*4,size:2+Math.random()*3,life:.8,color:'#ff0055'});}
                        SoundEngine.sfx('shatter');
                    }
                    if(en.vx||en.vy){
                        en.x+=en.vx*dt;en.y+=en.vy*dt;
                        en.vx*=0.92;en.vy*=0.92;
                        if(Math.abs(en.vx)<5&&Math.abs(en.vy)<5){en.vx=0;en.vy=0;}
                        en.x=Math.max(en.size,Math.min(WORLD_W-en.size,en.x));
                        en.y=Math.max(en.size,Math.min(WORLD_H-en.size,en.y));
                        juggernautMoved=true;
                    }
                }
                
                if(!juggernautMoved){
                    if(en.bomber){en.timer+=dt;if(en.timer>.1){en.timer=0;particles.push({x:en.x,y:en.y,life:.8,r:4,color:'#ff6600'});if(Math.hypot(player.x-en.x,player.y-en.y)<40){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{triggerDeath();return;}}}}
                    en.x+=Math.cos(en.angle+wobA)*en.speed*slowMult*tutSlow*dt;
                    en.y+=Math.sin(en.angle+wobA)*en.speed*slowMult*tutSlow*dt;
                    en.x=Math.max(en.size,Math.min(WORLD_W-en.size,en.x));
                    en.y=Math.max(en.size,Math.min(WORLD_H-en.size,en.y));
                }
                if(dist<en.size*.5+player.r*.65){
                    if(buffs.shieldOn||shieldUsed){
                        if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;SoundEngine.sfx('shield');updateBuffsHUD();}
                        shieldUsed=true;en.hp--;if(en.hp<=0){
                            if(en.splitter&&en.splitCount>0){en.splitCount--;for(let i=0;i<2;i++){const a=Math.atan2(player.y-en.y,player.x-en.x)+(i===0?.3:-.3);enemies.push({x:en.x,y:en.y,size:en.size*.7,speed:en.speed*1.1,angle:a,wob:Math.random()*Math.PI*2,type:en.type,hp:1,maxHp:1,splitter:false,tank:false,zigzag:false,bomber:false,color:'#4bf5ff'});}}
                            explodeEnemy(en);enemies.splice(idx,1);kills++;updateKillsHUD();
                        }else{en.x-=Math.cos(ang)*22;en.y-=Math.sin(ang)*22;}
                    }else{triggerDeath();return;}
                }
            }

            // BOSS LOGIC (abbreviated from original for brevity, but fully functional)
            for(let i=bosses.length-1;i>=0;i--){
                const b=bosses[i];if(b.flash>0)b.flash-=dt;
                const dx=player.x-b.x,dy=player.y-b.y,dist=Math.hypot(dx,dy);
                closestDist=Math.min(closestDist,dist-b.size*.5-player.r);
                b.wob+=dt*1.3;const wobA=Math.sin(b.wob)*.14;b.angle=Math.atan2(dy,dx);
                const enrage=b.hp<b.maxHp*.5;

                // Type 2: Glacial Wraith
                if(b.type===2){
                    if(b.iceShield){b.shieldRegen+=dt;if(b.shieldRegen>0.6&&b.shieldHP<b.shieldMax){b.shieldHP=Math.min(b.shieldMax,b.shieldHP+0.7);b.shieldRegen=0;}}
                    if(dist<160){b.freezeAura+=dt;if(b.freezeAura>1)b.freezeAura=1;if(Math.random()<0.3)particles.push({x:player.x+(Math.random()-.5)*30,y:player.y+(Math.random()-.5)*30,life:.2,r:2,color:'#88ddff'});}
                    b.spiralTimer-=dt;const sInterval=enrage?0.7:1.2;
                    if(b.spiralTimer<=0){b.spiralTimer=sInterval;
                        for(let k=0;k<6;k++){const a=b.spiralAngle+k*Math.PI/3;bossBullets.push({x:b.x+Math.cos(a)*b.size*.5,y:b.y+Math.sin(a)*b.size*.5,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:5,life:2.8,color:'#88ddff',ice:true});}
                        b.spiralAngle+=0.35;SoundEngine.sfx('collect');
                    }
                    b.iceSpikeTimer-=dt;if(b.iceSpikeTimer<=0){b.iceSpikeTimer=enrage?1.0:1.6;
                        const spikeCount=enrage?4:3;for(let k=0;k<spikeCount;k++){const ang=Math.random()*Math.PI*2;const rad=40+Math.random()*120;const sx=player.x+Math.cos(ang)*rad,sy=player.y+Math.sin(ang)*rad;if(Math.hypot(player.x-sx,player.y-sy)<25){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{triggerDeath();return;}}for(let j=0;j<4;j++)shards.push({x:sx+(Math.random()-.5)*10,y:sy+(Math.random()-.5)*10,vx:(Math.random()-.5)*60,vy:-80-Math.random()*60,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*4,size:2+Math.random()*3,life:.8,color:'#88ddff'});shockwaves.push({x:sx,y:sy,r:0,maxR:35,color:'rgba(136,221,255,.3)',hostile:false});}SoundEngine.sfx('shatter');
                    }
                    b.x+=Math.cos(b.angle+wobA)*b.speed*slowMult*dt;
                    b.y+=Math.sin(b.angle+wobA)*b.speed*slowMult*dt;
                    b.x=Math.max(b.size*.5,Math.min(WORLD_W-b.size*.5,b.x));
                    b.y=Math.max(b.size*.5,Math.min(WORLD_H-b.size*.5,b.y));
                    if(dist<b.size*.45+player.r*.65){
                        if(b.iceShield&&b.shieldHP>0){b.shieldHP-=2;b.flash=.12;screenShake=7;b.x-=Math.cos(b.angle)*22;b.y-=Math.sin(b.angle)*22;SoundEngine.sfx('shield');if(b.shieldHP<=0){b.iceShield=false;b.shieldHP=0;for(let k=0;k<10;k++){const a3=Math.random()*Math.PI*2,s3=60+Math.random()*120;shards.push({x:b.x,y:b.y,vx:Math.cos(a3)*s3,vy:Math.sin(a3)*s3,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*5,size:3+Math.random()*4,life:1.4,color:'#88ddff'});}shockwaves.push({x:b.x,y:b.y,r:0,maxR:170,color:'rgba(136,221,255,.4)',hostile:false});SoundEngine.sfx('shatter');}}else if(buffs.shieldOn||shieldUsed){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;SoundEngine.sfx('shield');updateBuffsHUD();}shieldUsed=true;b.hp-=2;b.flash=.18;screenShake=10;b.x-=Math.cos(b.angle)*30;b.y-=Math.sin(b.angle)*30;if(b.hp<=0)killBoss(b,i);}else{triggerDeath();return;}
                    }
                    continue;
                }

                // Type 3: Inferno Colossus
                if(b.type===3){
                    b.phaseTimer+=dt;b.corePulse+=dt*2.5;
                    const enrage3=b.hp<b.maxHp*.45;
                    if(enrage3&&!b.rageTriggered){
                        b.rageTriggered=true;b.rageMode=true;
                        b.speed=72;b.shootTimer=.6;b.minionTimer=.7;
                        screenShake=22;
                        for(let k=0;k<24;k++){const a=Math.PI*2*k/24+Math.random()*.3,s=80+Math.random()*200;shards.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*6,size:3+Math.random()*6,life:2.0,color:'#ff6600'});}
                        shockwaves.push({x:b.x,y:b.y,r:0,maxR:300,color:'rgba(255,100,0,0.6)',hostile:true});
                        SoundEngine.sfx('bossAppear');
                    }
                    b.heatAura+=dt;
                    if(dist<140&&b.heatAura>0.4){
                        b.heatAura=0;
                        if(Math.random()<0.3)particles.push({x:player.x+(Math.random()-.5)*20,y:player.y+(Math.random()-.5)*20,life:.2,r:1.5,color:'#ff4400'});
                        if(dist<90){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{player.hp-=3;b.flash=.1;screenShake=3;if(player.hp<=0){triggerDeath();return;}}}
                    }
                    b.shootTimer-=dt;
                    if(b.shootTimer<=0){
                        b.shootTimer=enrage3?0.55:0.9;
                        const count=enrage3?4:3;
                        const spread=enrage3?0.18:0.12;
                        for(let j=0;j<count;j++){
                            const a=b.angle-(count-1)*spread/2+j*spread;
                            const spd=200+Math.random()*80;
                            bossBullets.push({x:b.x+Math.cos(a)*b.size*.45,y:b.y+Math.sin(a)*b.size*.45,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:5,life:3.5,color:'#ff6600',fire:true,trail:true});
                        }
                        if(enrage3){for(let j=0;j<6;j++){const a=b.angle+j*Math.PI/3;bossBullets.push({x:b.x+Math.cos(a)*b.size*.3,y:b.y+Math.sin(a)*b.size*.3,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:4,life:2.5,color:'#ffaa00',fire:true});}}
                        SoundEngine.sfx('collect');
                    }
                    b.meteorTimer-=dt;
                    if(b.meteorTimer<=0){
                        b.meteorTimer=enrage3?3.0:5.0;
                        const meteorCount=enrage3?3:2;
                        for(let m=0;m<meteorCount;m++){
                            const targetX=player.x+(Math.random()-.5)*120;
                            const targetY=player.y+(Math.random()-.5)*120;
                            let fallStep=0;
                            const fallInterval=setInterval(()=>{
                                fallStep++;
                                if(fallStep>8){clearInterval(fallInterval);return;}

        function updateShards(dt){for(let i=shards.length-1;i>=0;i--){const s=shards[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.98;s.vy*=.98;s.rot+=s.vr*dt;s.life-=dt;if(s.life<=0)shards.splice(i,1);}enforceArrayLimits();}

        function updateFriends(dt){

                const f=friends[i];f.life-=dt;if(f.life<=0){friends.splice(i,1);updatePointsHUD();continue;}f.wob+=dt*2;
                const ba=player.angle+Math.PI,tx=player.x+Math.cos(ba)*45,ty=player.y+Math.sin(ba)*45;

                if(dist>2.5){f.x+=(dx/dist)*FRIEND_SPEED*dt;f.y+=(dy/dist)*FRIEND_SPEED*dt;}
                f.x=Math.max(f.size,Math.min(WORLD_W-f.size,f.x));f.y=Math.max(f.size,Math.min(WORLD_H-f.size,f.y));
                let target=null,bestD=450;
                for(const b of bosses){const d=Math.hypot(b.x-f.x,b.y-f.y);if(d<bestD){bestD=d;target=b;}}
                for(const en of enemies){const d=Math.hypot(en.x-f.x,en.y-f.y);if(d<bestD){bestD=d;target=en;}}
                if(target){f.shootCooldown-=dt;if(f.shootCooldown<=0){f.shootCooldown=.4;const a=Math.atan2(target.y-f.y,target.x-f.x);const dmgB=levelStats.damageBonus;bullets.push({x:f.x+Math.cos(a)*f.size,y:f.y+Math.sin(a)*f.size,vx:Math.cos(a)*540,vy:Math.sin(a)*540,r:3.5,damage:Math.round(1*dmgB),life:1.2,color:'#3dffa0',owner:'p1'});}}
                for(const en of enemies){if(Math.hypot(f.x-en.x,f.y-en.y)<f.size*.45+en.size*.4){f.hp=(f.hp||2)-1;const a=Math.atan2(en.y-f.y,en.x-f.x);en.x+=Math.cos(a)*35;en.y+=Math.sin(a)*35;if(f.hp<=0){friends.splice(i,1);updatePointsHUD();break;}}}
            }

        // True when we want to reduce GPU load: any mobile device (solo, host, or client).

        function render(){

                ctx.restore();
            }

            for(const o of obstacles){if(o.hp<=0)continue;const sz=Math.min(o.w,o.h)*.6;ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(o.angle+Math.sin(elapsed*.35+o.pulse)*.012);ctx.shadowColor=o.flash>0?'#fff':o.color;ctx.shadowBlur=o.flash>0?10:4;ctx.beginPath();if(o.type==='diamond'){ctx.moveTo(0,-sz);ctx.lineTo(sz*.55,0);ctx.lineTo(0,sz);ctx.lineTo(-sz*.55,0);ctx.closePath();}else if(o.type==='hexagon'){for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;const px=Math.cos(a)*sz,py=Math.sin(a)*sz;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();}else{ctx.rect(-o.w/2,-o.h/2,o.w,o.h);}ctx.fillStyle=o.flash>0?'#fff':o.color;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,240,.15)';ctx.lineWidth=.8;ctx.stroke();ctx.restore();if(o.hp<o.maxHp){const bw=o.w*1.0,bh=2.5,bx=o.x+o.w/2-bw/2,by=o.y-4;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=o.hp/o.maxHp>.5?'#4bf5ff':'#ff3b5c';ctx.fillRect(bx,by,bw*(o.hp/o.maxHp),bh);}if(o.flash>0)o.flash-=.035;}

            for(const bp of boostPads){ctx.save();ctx.globalAlpha=bp.cooldown>0?.15:.75;ctx.translate(bp.x,bp.y);ctx.strokeStyle='#5cff7e';ctx.lineWidth=2;ctx.shadowColor='#5cff7e';ctx.shadowBlur=8;ctx.rotate(elapsed*.9);ctx.beginPath();ctx.arc(0,0,bp.r,0,Math.PI*1.2);ctx.stroke();ctx.rotate(Math.PI);ctx.beginPath();ctx.arc(0,0,bp.r*.55,0,Math.PI*1.2);ctx.stroke();ctx.restore();}

            for(const ex of explosions){ctx.save();ctx.globalAlpha=ex.alpha;ctx.strokeStyle=ex.color;ctx.lineWidth=1.5*(1-ex.r/ex.maxR);ctx.shadowColor=ex.color;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r,0,Math.PI*2);ctx.stroke();ctx.restore();}
            for(const sw of shockwaves){ctx.save();ctx.beginPath();ctx.arc(sw.x,sw.y,sw.r,0,Math.PI*2);ctx.strokeStyle=sw.color;ctx.lineWidth=2.5*(1-sw.r/sw.maxR);ctx.globalAlpha=1-sw.r/sw.maxR;ctx.stroke();ctx.restore();}

        function drawPlayerLight_Context(targetCtx,x,y,r,angle,skin,tier,isP2=false){

                    targetCtx.fillStyle='rgba(160,200,255,.9)';targetCtx.beginPath();targetCtx.arc(r*.22,0,r*.09,0,Math.PI*2);targetCtx.fill();

                    targetCtx.fillStyle='rgba(200,120,255,.95)';targetCtx.beginPath();targetCtx.arc(r*.12,0,r*.12,0,Math.PI*2);targetCtx.fill();
                }else if(skin==='pulse_storm'){
                    // Jagged lightning-bolt armour plating

        function renderLayoutEditor(actionsOverride,onDoneOverride){
            const actionList=actionsOverride||['charge','shoot','boost','freeze','bigshot','evolve','friend'];
            const goBack=onDoneOverride||(()=>{overlay.classList.add('hidden');renderMainMenu();});
            overlay.classList.remove('hidden');

            const EMOJIS={charge:'⚡',shoot:'🔫',boost:'💨',freeze:'❄️',bigshot:'💥',evolve:'👑',friend:'🤝'};
            const COLORS={charge:'rgba(75,245,255,.5)',shoot:'rgba(255,59,92,.5)',boost:'rgba(92,255,126,.5)',
                          freeze:'rgba(136,221,255,.5)',bigshot:'rgba(255,140,59,.5)',evolve:'rgba(179,75,255,.5)',friend:'rgba(255,225,75,.5)'};

            overlay.innerHTML=`
                <div style="position:fixed;inset:0;background:transparent;z-index:30;">
                    <!-- Header -->
                    <div class="layout-header">
                        <div class="layout-header-top">
                            <div class="layout-header-info">
                                <div class="layout-header-title">📐 BUTTON LAYOUT</div>
                                <div class="layout-header-hint">Hold & drag any button to reposition</div>
                            </div>
                            <div style="display:flex;gap:4px;align-items:center;">
                                <div style="width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:buffPulse 1.5s infinite;"></div>
                                <span style="font-size:9px;color:var(--gold);font-weight:700;">EDIT MODE</span>
                            </div>
                        </div>
                        <div class="layout-footer">
                            <button id="layoutCancelBtn" class="secondary" style="padding:9px 12px;font-size:10.5px;min-width:64px;">✗ Cancel</button>
                            <button id="resetLayoutBtn" class="secondary" style="padding:9px 12px;font-size:10.5px;min-width:64px;border-color:rgba(255,225,75,0.2);color:var(--gold);">↺ Reset</button>
                            <button id="layoutDoneBtn" class="btn-solo-run" style="flex:1;max-width:200px;padding:10px 0;font-size:12px;"><span>✓ Save Layout</span></button>
                        </div>
                    </div>

                    <!-- Game-area -->
                    <div id="layoutEditor" style="position:fixed;inset:0;z-index:31;touch-action:none;">
                        <!-- Joystick zone indicator -->
                        <div class="layout-zone" style="left:8px;bottom:8px;width:clamp(90px,22vw,130px);height:clamp(90px,22vw,130px);transform:none;border-color:rgba(124,92,255,0.25);background:rgba(124,92,255,0.03);">
                            <div style="line-height:1.5;padding:6px;text-align:center;">🕹️<br><span style="font-size:7px;color:rgba(124,92,255,0.5);">MOVE ZONE</span></div>
                        </div>
                        <!-- Right thumb comfort zone -->
                        <div class="layout-zone" style="right:6px;bottom:6px;width:clamp(160px,45vw,230px);height:clamp(160px,45vw,230px);transform:none;border-color:rgba(75,245,255,0.1);border-radius:50%;background:rgba(75,245,255,0.02);">
                            <div style="text-align:center;padding:6px;">
                                <div style="font-size:12px;">👍</div>
                                <div style="font-size:7px;color:rgba(75,245,255,0.25);line-height:1.4;">BUTTON<br>ZONE</div>
                            </div>
                        </div>
                        ${actionList.map(action=>{
                            const pos=btnLayout[action]||{x:0.85,y:0.75};
                            const label=action.charAt(0).toUpperCase()+action.slice(1);
                            const emoji=EMOJIS[action]||'●';
                            const col=COLORS[action]||'rgba(255,255,255,.3)';
                            return `<div class="layout-btn" data-action="${action}"
                                style="left:${pos.x*100}%;top:${pos.y*100}%;transform:translate(-50%,-50%);
                                       border-color:${col};box-shadow:0 2px 14px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.04),0 0 16px ${col.replace('rgba','rgb').replace(',0.5)',')')+'33'};">
                                <span class="ico">${emoji}</span>
                                <span class="lbl">${label}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;

            const editor=document.getElementById('layoutEditor');
            const btns=editor.querySelectorAll('.layout-btn');
            let dragTarget=null;
            let dragOffsetX=0,dragOffsetY=0;

            btns.forEach(btn=>{
                const startDrag=(e,clientX,clientY)=>{
                    e.preventDefault();
                    e.stopPropagation();
                    const bRect=btn.getBoundingClientRect();
                    dragTarget=btn;
                    dragOffsetX=clientX-(bRect.left+bRect.width/2);
                    dragOffsetY=clientY-(bRect.top+bRect.height/2);
                    btn.classList.add('dragging');
                    btn.style.cursor='grabbing';
                };
                btn.addEventListener('mousedown',(e)=>startDrag(e,e.clientX,e.clientY));
                btn.addEventListener('touchstart',(e)=>{
                    const t=e.changedTouches[0];
                    startDrag(e,t.clientX,t.clientY);
                },{passive:false});
            });

            const doDrag=(clientX,clientY)=>{
                if(!dragTarget)return;
                const Ww=window.innerWidth,Wh=window.innerHeight;
                let x=(clientX-dragOffsetX)/Ww;
                let y=(clientY-dragOffsetY)/Wh;
                x=Math.max(0.02,Math.min(0.98,x));
                y=Math.max(0.02,Math.min(0.98,y));
                const action=dragTarget.dataset.action;
                btnLayout[action]={x,y};
                dragTarget.style.left=(x*100)+'%';
                dragTarget.style.top=(y*100)+'%';
            };

            const onDragMove=(e)=>{doDrag(e.clientX,e.clientY);};
            const onDragTouch=(e)=>{
                e.preventDefault();
                const t=e.changedTouches[0];
                doDrag(t.clientX,t.clientY);
            };
            const endDrag=()=>{
                if(dragTarget){
                    dragTarget.classList.remove('dragging');
                    dragTarget.style.cursor='grab';
                    dragTarget=null;
                }
            };

            document.addEventListener('mousemove',onDragMove);
            document.addEventListener('touchmove',onDragTouch,{passive:false});
            document.addEventListener('mouseup',endDrag);
            document.addEventListener('touchend',endDrag);

            document.getElementById('resetLayoutBtn').addEventListener('click',()=>{
                for(const a of actionList)btnLayout[a]={...DEFAULT_BTN_LAYOUT[a]};
                saveLayout();
                applyLayout();
                document.removeEventListener('mousemove',onDragMove);
                document.removeEventListener('touchmove',onDragTouch);
                document.removeEventListener('mouseup',endDrag);
                document.removeEventListener('touchend',endDrag);
                renderLayoutEditor(actionsOverride,onDoneOverride);
            });

            document.getElementById('layoutDoneBtn').addEventListener('click',()=>{
                saveLayout();
                applyLayout();
                document.removeEventListener('mousemove',onDragMove);
                document.removeEventListener('touchmove',onDragTouch);
                document.removeEventListener('mouseup',endDrag);
                document.removeEventListener('touchend',endDrag);
                overlay.classList.add('hidden');
                goBack();
            });
            const cancelLayoutEl=document.getElementById('layoutCancelBtn');
            if(cancelLayoutEl)cancelLayoutEl.addEventListener('click',()=>{
                document.removeEventListener('mousemove',onDragMove);
                document.removeEventListener('touchmove',onDragTouch);
                document.removeEventListener('mouseup',endDrag);
                document.removeEventListener('touchend',endDrag);
                overlay.classList.add('hidden');
                goBack();
            });
        }
