<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapSave · Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg-primary:#0a0a12; --bg-card:rgba(255,255,255,0.04); --border-glass:rgba(255,255,255,0.06); --text-primary:#f1f1f7; --text-secondary:#a0a0b8; --text-muted:#6b6b85; --accent-1:#7c5cfc; --accent-2:#5c9cfc; --accent-3:#fc5c9c; --gradient-main:linear-gradient(135deg,#7c5cfc,#5c9cfc,#fc5c9c); --shadow-glow:0 8px 40px rgba(124,92,252,0.25); --radius-lg:24px; --radius-sm:12px; --transition:0.3s cubic-bezier(0.34,1.56,0.64,1); }
    body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background-image:radial-gradient(ellipse at 20% 50%,rgba(124,92,252,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(252,92,156,0.08) 0%,transparent 60%); background-attachment:fixed; }
    .app-wrapper { width:100%; max-width:780px; margin:0 auto; }
    .glass-card { background:var(--bg-card); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border-glass); border-radius:var(--radius-lg); padding:40px 36px; box-shadow:var(--shadow-glow); transition:var(--transition); }
    @media (max-width:480px) { .glass-card { padding:28px 18px; } }
    .app-header { text-align:center; margin-bottom:36px; }
    .app-header .logo { display:inline-flex; align-items:center; gap:12px; font-size:28px; font-weight:700; letter-spacing:-0.02em; background:var(--gradient-main); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .app-header .logo i { font-size:32px; -webkit-text-fill-color:initial; color:var(--accent-1); filter:drop-shadow(0 0 12px rgba(124,92,252,0.3)); }
    .app-header .subtitle { color:var(--text-secondary); font-size:15px; }
    .step { margin-bottom:30px; }
    .step:last-of-type { margin-bottom:32px; }
    .step-label { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:14px; }
    .step-label .badge { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--gradient-main); font-size:12px; font-weight:700; color:#fff; -webkit-text-fill-color:#fff; }
    .option-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .option-card { display:flex; align-items:center; gap:14px; padding:18px 20px; background:rgba(255,255,255,0.02); border:1.5px solid rgba(255,255,255,0.06); border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); user-select:none; position:relative; }
    .option-card:hover { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.12); transform:translateY(-2px); }
    .option-card.active { background:rgba(124,92,252,0.12); border-color:var(--accent-1); box-shadow:0 0 0 1px var(--accent-1),0 4px 20px rgba(124,92,252,0.15); }
    .option-card .icon-wrap { display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:var(--radius-sm); background:rgba(255,255,255,0.04); font-size:22px; color:var(--text-secondary); flex-shrink:0; }
    .option-card.active .icon-wrap { background:rgba(124,92,252,0.2); color:var(--accent-1); }
    .option-card .info { flex:1; }
    .option-card .info .title { font-size:16px; font-weight:600; color:var(--text-primary); }
    .option-card .info .desc { font-size:13px; color:var(--text-muted); margin-top:1px; }
    .option-card .check { display:none; color:var(--accent-1); font-size:18px; }
    .option-card.active .check { display:block; }
    @media (max-width:480px) { .option-grid { grid-template-columns:1fr 1fr; gap:10px; } .option-card { padding:14px; flex-direction:column; text-align:center; gap:6px; } .option-card .icon-wrap { width:38px; height:38px; font-size:18px; } .option-card .info .title { font-size:14px; } .option-card .info .desc { font-size:11px; } .option-card .check { position:absolute; top:8px; right:10px; font-size:14px; } }
    .url-input-wrap { display:flex; gap:12px; background:rgba(255,255,255,0.03); border:1.5px solid rgba(255,255,255,0.06); border-radius:var(--radius-sm); padding:4px; transition:var(--transition); }
    .url-input-wrap:focus-within { border-color:var(--accent-1); box-shadow:0 0 0 3px rgba(124,92,252,0.15); }
    .url-input-wrap input { flex:1; background:transparent; border:none; padding:14px 18px; font-size:15px; font-family:inherit; color:var(--text-primary); outline:none; }
    .url-input-wrap input::placeholder { color:var(--text-muted); }
    .url-input-wrap .paste-btn { display:flex; align-items:center; gap:8px; padding:10px 20px; background:rgba(255,255,255,0.06); border:none; border-radius:var(--radius-sm); color:var(--text-secondary); font-size:14px; font-weight:500; font-family:inherit; cursor:pointer; transition:var(--transition); white-space:nowrap; }
    .url-input-wrap .paste-btn:hover { background:rgba(255,255,255,0.10); color:var(--text-primary); }
    @media (max-width:480px) { .url-input-wrap { flex-wrap:wrap; } .url-input-wrap input { width:100%; padding:14px 16px; } .url-input-wrap .paste-btn { width:100%; justify-content:center; padding:12px; } }
    .btn-group { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
    .download-btn { display:flex; align-items:center; justify-content:center; gap:14px; width:100%; padding:18px 28px; background:var(--gradient-main); border:none; border-radius:var(--radius-sm); font-size:18px; font-weight:600; font-family:inherit; color:#fff; cursor:pointer; transition:var(--transition); position:relative; overflow:hidden; }
    .download-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 32px rgba(124,92,252,0.35); }
    .download-btn:active:not(:disabled) { transform:scale(0.97); }
    .download-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none !important; }
    .download-btn .spinner { display:none; width:22px; height:22px; border:2.5px solid rgba(255,255,255,0.2); border-top:2.5px solid #fff; border-radius:50%; animation:spin 0.8s linear infinite; }
    .download-btn.loading .spinner { display:block; }
    .download-btn.loading .btn-text { display:none; }
    .download-btn .btn-text { display:inline-flex; align-items:center; gap:10px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .share-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 20px; background:transparent; border:1.5px solid var(--border-glass); border-radius:var(--radius-sm); color:var(--text-secondary); font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; transition:var(--transition); }
    .share-btn:hover { background:var(--bg-card-hover); border-color:rgba(255,255,255,0.15); color:var(--text-primary); }
    .progress-wrap { margin-top:18px; display:none; }
    .progress-wrap.visible { display:block; animation:fadeUp 0.5s ease; }
    .progress-bar-bg { width:100%; height:6px; border-radius:10px; background:rgba(255,255,255,0.06); overflow:hidden; }
    .progress-bar-fill { height:100%; width:0%; border-radius:10px; background:var(--gradient-main); transition:width 0.2s ease; }
    .progress-status { display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary); margin-top:8px; }
    .progress-status .status-text { display:flex; align-items:center; gap:8px; }
    .progress-status .status-text i { color:var(--accent-1); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .toast { display:none; align-items:center; gap:12px; padding:16px 20px; border-radius:var(--radius-sm); margin-top:18px; font-size:14px; font-weight:500; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); animation:fadeUp 0.4s ease; }
    .toast.visible { display:flex; }
    .toast.error { border-color:rgba(252,92,92,0.3); background:rgba(252,92,92,0.08); color:#fc6b6b; }
    .toast.success { border-color:rgba(92,252,156,0.3); background:rgba(92,252,156,0.08); color:#5cfc9c; }
    .toast i { font-size:18px; }
    .app-footer { text-align:center; margin-top:28px; font-size:13px; color:var(--text-muted); }
    .app-footer a { color:var(--accent-1); text-decoration:none; font-weight:500; }
    .app-footer a:hover { color:var(--accent-2); }
    .backend-status { display:flex; align-items:center; justify-content:center; gap:10px; margin:16px 0 10px; font-size:14px; }
    .backend-status .dot { width:10px; height:10px; border-radius:50%; display:inline-block; transition:0.2s; }
    .backend-status .dot.online { background:#5cfc9c; box-shadow:0 0 8px #5cfc9c; }
    .backend-status .dot.offline { background:#fc6b6b; box-shadow:0 0 8px #fc6b6b; }
    .backend-status .dot.checking { background:#f0c94d; animation:pulse 1s infinite; }
    @keyframes pulse { 0% { opacity:0.4; } 50% { opacity:1; } 100% { opacity:0.4; } }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="glass-card">
    <header class="app-header">
      <div class="logo"><i class="fas fa-cloud-arrow-down"></i> SnapSave</div>
      <p class="subtitle">Real downloads · YouTube &amp; Pinterest</p>
    </header>

    <!-- Backend status -->
    <div class="backend-status">
      <span class="dot checking" id="backendDot"></span>
      <span id="backendLabel">Checking backend…</span>
    </div>

    <!-- Step 1: Platform -->
    <div class="step">
      <div class="step-label"><span class="badge">1</span> Platform</div>
      <div class="option-grid" id="platformGrid">
        <div class="option-card active" data-value="youtube"><div class="icon-wrap"><i class="fab fa-youtube"></i></div><div class="info"><div class="title">YouTube</div><div class="desc">Videos &amp; shorts</div></div><div class="check"><i class="fas fa-check-circle"></i></div></div>
        <div class="option-card" data-value="pinterest"><div class="icon-wrap"><i class="fab fa-pinterest"></i></div><div class="info"><div class="title">Pinterest</div><div class="desc">Pins &amp; videos</div></div><div class="check"><i class="fas fa-check-circle"></i></div></div>
      </div>
    </div>

    <!-- Step 2: Format -->
    <div class="step">
      <div class="step-label"><span class="badge">2</span> Format</div>
      <div class="option-grid" id="formatGrid">
        <div class="option-card active" data-value="mp3"><div class="icon-wrap"><i class="fas fa-music"></i></div><div class="info"><div class="title">MP3</div><div class="desc">Audio only</div></div><div class="check"><i class="fas fa-check-circle"></i></div></div>
        <div class="option-card" data-value="mp4"><div class="icon-wrap"><i class="fas fa-video"></i></div><div class="info"><div class="title">MP4</div><div class="desc">Video + audio</div></div><div class="check"><i class="fas fa-check-circle"></i></div></div>
      </div>
    </div>

    <!-- Step 3: Link -->
    <div class="step">
      <div class="step-label"><span class="badge">3</span> Link</div>
      <div class="url-input-wrap">
        <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false" />
        <button class="paste-btn" id="pasteBtn" type="button"><i class="fas fa-paste"></i> Paste</button>
      </div>
    </div>

    <!-- Buttons: Download + Share -->
    <div class="btn-group">
      <button class="download-btn" id="downloadBtn">
        <span class="spinner"></span>
        <span class="btn-text"><i class="fas fa-download"></i> Download Now</span>
      </button>
      <button class="share-btn" id="shareBtn">
        <i class="fas fa-share-alt"></i> Share this tool
      </button>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-status">
        <span class="status-text"><i class="fas fa-circle-notch fa-fw fa-spin"></i> <span id="statusText">Preparing…</span></span>
        <span id="percentText">0%</span>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><i class="fas fa-circle-exclamation"></i><span id="toastMessage"></span></div>
  </div>

  <footer class="app-footer">
    <span>⚡ Real downloads via backend (yt‑dlp) · YouTube fallback via public proxy.</span><br />
    <span style="font-size:12px;color:var(--text-muted);"><i class="fas fa-lock" style="opacity:0.5;"></i> Your data stays private</span>
  </footer>
</div>

<script>
(function() {
  'use strict';

  // ── DOM refs ──
  const platformCards = document.querySelectorAll('#platformGrid .option-card');
  const formatCards = document.querySelectorAll('#formatGrid .option-card');
  const urlInput = document.getElementById('urlInput');
  const pasteBtn = document.getElementById('pasteBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const shareBtn = document.getElementById('shareBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');
  const percentText = document.getElementById('percentText');
  const toast = document.getElementById('toast');
  const toastMessage = document.getElementById('toastMessage');
  const backendDot = document.getElementById('backendDot');
  const backendLabel = document.getElementById('backendLabel');

  let selectedPlatform = 'youtube';
  let selectedFormat = 'mp3';
  let isDownloading = false;
  let backendOnline = false;

  // ── Helpers ──
  function showToast(message, type = 'error') {
    toast.className = 'toast visible ' + type;
    toastMessage.textContent = message;
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove('visible'), 6000);
  }
  function hideToast() { toast.classList.remove('visible'); clearTimeout(toast._hideTimer); }

  function setProgress(percent, status) {
    progressWrap.classList.add('visible');
    const clamped = Math.min(100, Math.max(0, percent));
    progressFill.style.width = clamped + '%';
    percentText.textContent = Math.round(clamped) + '%';
    if (status) statusText.textContent = status;
  }
  function resetProgress() {
    progressWrap.classList.remove('visible');
    progressFill.style.width = '0%';
    percentText.textContent = '0%';
    statusText.textContent = 'Preparing…';
  }

  function setLoading(loading) {
    isDownloading = loading;
    downloadBtn.disabled = loading;
    downloadBtn.classList.toggle('loading', loading);
    if (!loading) resetProgress();
  }

  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ── Share button ──
  shareBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      showToast('Link copied to clipboard!', 'success');
    } catch (_) {
      // fallback
      const input = document.createElement('input');
      input.value = window.location.href;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast('Link copied!', 'success');
    }
  });

  // ── Backend health check ──
  async function checkBackend() {
    backendDot.className = 'dot checking';
    backendLabel.textContent = 'Checking backend…';
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      const res = await fetch('/health', { signal: controller.signal });
      clearTimeout(timeout);
      if (res.ok) {
        backendOnline = true;
        backendDot.className = 'dot online';
        backendLabel.textContent = '✅ Backend online (yt‑dlp ready)';
      } else {
        throw new Error('Not ok');
      }
    } catch (_) {
      backendOnline = false;
      backendDot.className = 'dot offline';
      backendLabel.textContent = '⚠️ Backend offline — YouTube will use public proxy, Pinterest will fallback to guide.';
    }
  }

  // ── Option selection ──
  function selectOption(cards, value) {
    cards.forEach(c => c.classList.toggle('active', c.dataset.value === value));
  }

  platformCards.forEach(c => {
    c.addEventListener('click', () => {
      if (isDownloading) return;
      selectedPlatform = c.dataset.value;
      selectOption(platformCards, selectedPlatform);
      hideToast();
      urlInput.placeholder = selectedPlatform === 'youtube' ?
        'https://www.youtube.com/watch?v=…' :
        'https://www.pinterest.com/pin/…';
    });
  });

  formatCards.forEach(c => {
    c.addEventListener('click', () => {
      if (isDownloading) return;
      selectedFormat = c.dataset.value;
      selectOption(formatCards, selectedFormat);
      hideToast();
    });
  });

  pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) { urlInput.value = text; urlInput.focus(); hideToast(); }
    } catch (_) { showToast('Cannot access clipboard. Paste manually.', 'error'); }
  });

  // ── Main download ──
  async function performDownload() {
    const url = urlInput.value.trim();
    if (!url) { showToast('Please paste a valid link.', 'error'); return; }

    let isValid = false;
    try {
      const parsed = new URL(url);
      if (selectedPlatform === 'youtube')
        isValid = parsed.hostname.includes('youtube.com') || parsed.hostname.includes('youtu.be');
      else
        isValid = parsed.hostname.includes('pinterest.com');
    } catch (_) {}
    if (!isValid) {
      showToast(`Please enter a valid ${selectedPlatform === 'youtube' ? 'YouTube' : 'Pinterest'} link.`, 'error');
      return;
    }

    hideToast();
    setLoading(true);

    try {
      // If backend is online, always use it (real files)
      if (backendOnline) {
        const ok = await tryBackendDownload(url, selectedPlatform, selectedFormat);
        if (ok) { setLoading(false); return; }
        showToast('Backend failed, falling back to alternative…', 'error');
      }

      // Fallback: YouTube public API (real), Pinterest guide
      if (selectedPlatform === 'youtube') {
        await downloadYouTubePublic(url, selectedFormat);
      } else {
        await downloadPinterestFallback(url, selectedFormat);
      }
    } catch (err) {
      console.error(err);
      showToast(err.message || 'Download failed. Please try again.', 'error');
    } finally {
      setLoading(false);
    }
  }

  // ── Backend download (real) ──
  async function tryBackendDownload(url, platform, format) {
    const backendUrl = '/download';
    setProgress(10, 'Connecting to backend…');

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);

    try {
      const response = await fetch(backendUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, platform, format }),
        signal: controller.signal,
      });
      clearTimeout(timeout);

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Backend error (${response.status}): ${errText}`);
      }

      const blob = await response.blob();
      const contentDisposition = response.headers.get('content-disposition');
      let filename = `download.${format === 'mp3' ? 'mp3' : 'mp4'}`;
      if (contentDisposition) {
        const match = contentDisposition.match(/filename="(.+)"/);
        if (match) filename = match[1];
      }

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 5000);

      setProgress(100, 'Download complete!');
      showToast('✅ Real download started!', 'success');
      await delay(1500);
      return true;
    } catch (err) {
      clearTimeout(timeout);
      console.warn('Backend request failed:', err.message);
      return false;
    }
  }

  // ── YouTube public API (real MP3/MP4) ──
  async function downloadYouTubePublic(url, format) {
    const endpoint = format === 'mp3' ?
      'https://api.vevioz.com/api/button/mp3/' :
      'https://api.vevioz.com/api/button/mp4/';
    setProgress(10, 'Fetching from public API…');
    const requestUrl = endpoint + '?url=' + encodeURIComponent(url);

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);

    try {
      const response = await fetch(requestUrl, { signal: controller.signal });
      clearTimeout(timeout);
      if (!response.ok) throw new Error(`API responded with ${response.status}`);

      const data = await response.json();
      const downloadUrl = data.download_url || data.link || data.url || data.download || data.video_url;
      if (!downloadUrl) throw new Error('No download URL in response.');

      setProgress(70, 'Starting real download…');
      window.open(downloadUrl, '_blank');

      setProgress(100, 'Done!');
      showToast('✅ Real download started!', 'success');
      await delay(2000);
    } catch (err) {
      clearTimeout(timeout);
      console.warn('Public API failed:', err);
      await simulateDownload(url, format);
    }
  }

  // ── Pinterest fallback (guide) ──
  async function downloadPinterestFallback(url, format) {
    setProgress(10, 'Pinterest requires backend for real downloads.');
    await delay(500);
    setProgress(30, 'Generating guide with instructions…');
    await delay(600);
    setProgress(50, 'Please set up the backend to download Pinterest.');
    await delay(700);
    setProgress(80, 'Almost ready…');

    const content = `
═══════════════════════════════════════════════
  📌  Pinterest Downloader  📌
═══════════════════════════════════════════════

For real Pinterest downloads, you need the backend.

🔗 Your Pin: ${url}
📦 Format requested: ${format.toUpperCase()}

─────────────────────────────────────────────
💡 How to get real downloads:

1. Start the Node.js backend (server.js) with yt‑dlp.
2. It will download the actual pin video/image.

Without backend, we provide this guide.

─────────────────────────────────────────────
✨  For now, use the official Pinterest app or
    a third‑party service.
═══════════════════════════════════════════════
    `.trim();

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const fakeUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = fakeUrl;
    link.download = `pinterest-guide_${Date.now()}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(fakeUrl), 5000);

    setProgress(100, 'Guide downloaded');
    showToast('📌 Guide saved — follow instructions for real download.', 'success');
    await delay(2000);
  }

  // ── Ultimate fallback (simulation) ──
  async function simulateDownload(url, format) {
    setProgress(10, 'Fallback simulation…');
    await delay(400);
    setProgress(40, 'Preparing info…');
    await delay(600);
    setProgress(70, 'Generating file…');

    const info = `
═══════════════════════════════════════════════
  🎬  SnapSave (simulated)  🎬
═══════════════════════════════════════════════

🔗 Source: ${url}
📦 Format: ${format.toUpperCase()}
🖥️  Platform: ${selectedPlatform === 'youtube' ? 'YouTube' : 'Pinterest'}

─────────────────────────────────────────────
⚡  This is a simulated download because the
    real download could not be obtained.

    For real downloads:
    - Start the backend (server.js)
    - Or use a reliable service.

─────────────────────────────────────────────
✏️  This file contains your request info.
═══════════════════════════════════════════════
    `.trim();

    const blob = new Blob([info], { type: 'text/plain;charset=utf-8' });
    const fakeUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = fakeUrl;
    link.download = `snapsave_${Date.now()}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(fakeUrl), 5000);

    setProgress(100, 'Simulated download saved');
    showToast('📥 Simulated file saved (real download failed)', 'error');
    await delay(2000);
  }

  // ── Events ──
  downloadBtn.addEventListener('click', performDownload);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !isDownloading) performDownload(); });

  // ── Init ──
  setTimeout(() => urlInput.focus(), 400);
  checkBackend();
  setInterval(checkBackend, 30000);
})();
</script>
</body>
</html>
